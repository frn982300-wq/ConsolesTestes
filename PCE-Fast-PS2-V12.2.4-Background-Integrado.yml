          	rm -f $(EE_OBJS) $(EE_BIN)
          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          PCE_FRONTEND_MAKE
          test -s pce-only/pce_only.c
          grep -q 'retro_get_memory_data(RETRO_MEMORY_SYSTEM_RAM)' pce-only/pce_only.c
          grep -q 'extract_pce_from_zip' pce-only/pce_only.c
