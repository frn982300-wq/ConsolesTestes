          grep -q 'gsKit_prim_sprite_texture(gs,&background_tex' pce-only/pce_only.c
          grep -q 'mass:/images/' pce-only/pce_only.c || grep -q 'images/' pce-only/pce_only.c
          grep -q 'title_screen("SELECT GAME")' pce-only/pce_only.c
