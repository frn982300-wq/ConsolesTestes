name: FCEUmm Core Integration Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build integrated NES/Famicom ELF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull official PS2DEV build container
        run: docker pull ghcr.io/ps2dev/ps2dev:latest

      - name: Build FCEUmm core and frontend
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2DEV=/usr/local/ps2dev \
            -e PS2SDK=/usr/local/ps2dev/ps2sdk \
            -e GSKIT=/usr/local/ps2dev/gsKit \
            ghcr.io/ps2dev/ps2dev:latest \
            sh -lc 'export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"; make -C src clean all' \
            2>&1 | tee build-core.log

      - name: Verify ELF output
        run: |
          test -s src/FCEUmm-NES-PS2.ELF
          file src/FCEUmm-NES-PS2.ELF
          ls -lh src/FCEUmm-NES-PS2.ELF

      - name: Upload integrated ELF and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-NES-PS2-Core-Integration
          path: |
            src/FCEUmm-NES-PS2.ELF
            build-core.log
          if-no-files-found: warn
