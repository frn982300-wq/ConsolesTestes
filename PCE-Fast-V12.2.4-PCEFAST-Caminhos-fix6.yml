          from pathlib import Path
          import re

          path = Path('pce-only/pce_only.c')
          s = path.read_text()

          # Compile out the input/debug overlay and its per-frame counters.
          if s.count('#define PCE_SHOW_DIAGNOSTICS 1') != 1:
              raise SystemExit('Expected exactly one diagnostics switch in frontend source.')
          s = s.replace('#define PCE_SHOW_DIAGNOSTICS 1', '#define PCE_SHOW_DIAGNOSTICS 0', 1)

          # Remove background/cover debug text from the visible UI; image fallback stays intact.
          s, n_bg = re.subn(r'^[ \t]*label\(548,466,1,background_loaded\?"BG PNG OK":"BG DEFAULT",aqua\);\n', '', s, flags=re.M)
          s, n_cover = re.subn(r'^[ \t]*label\(382,370,1,cover_debug,aqua\);\n', '', s, flags=re.M)
          if n_bg > 1 or n_cover != 1:
              raise SystemExit(f'Unexpected background status count ({n_bg}); expected at most one, and cover debug label count ({n_cover}) must be exactly one.')
          s = s.replace('    else if(cover_error) message=\"PNG ERROR\";', '')

          # Replace the detailed ZIP diagnostic page with a normal, user-friendly error page.
          pattern = r'(?ms)^[ \t]*static void render_load_debug\(void\) \{.*?^[ \t]*\}\nstatic int begin_game\(const char \*path\) \{'
          replacement = '''static void render_load_error(void) {
            uint64_t white=GS_SETREG_RGBAQ(230,240,245,0x80,0);
            uint64_t aqua=GS_SETREG_RGBAQ(50,210,175,0x80,0);
            title_screen("UNABLE TO LOAD GAME");
            label(24,170,2,"CHECK ROM OR ZIP FILE",white);
            label(24,420,1,"CIRCLE: BACK TO USB BROWSER",aqua);
          }
          static int begin_game(const char *path) {'''
          s, n_err = re.subn(pattern, replacement, s, count=1)
          if n_err != 1:
              raise SystemExit(f'Could not replace ZIP diagnostic screen; matches={n_err}.')
          if 'render_load_debug(); refresh_screen();' not in s:
              raise SystemExit('Expected load-debug call not found.')
          s = s.replace('render_load_debug(); refresh_screen();', 'render_load_error(); refresh_screen();', 1)

          # Remove external-cheat source diagnostics from the visible cheat menu.
          cht_pattern = r'(?m)^[ \t]*else \{\n[ \t]*snprintf\(item,sizeof\(item\),"%s CHT: %u",external_cht_loaded\?"EXTERNAL":"BUILT-IN",active_cheat_count\);\n[ \t]*label\(12,136,1,item,aqua\);\n[ \t]*\}\n[ \t]*label\(12,148,1,external_cht_debug,aqua\);'
          s, n_cht = re.subn(cht_pattern, '            else label(12,136,1,"SELECT A CHEAT TO TOGGLE",aqua);', s, count=1)
          if n_cht != 1:
              raise SystemExit(f'Expected one external CHT diagnostic block, found {n_cht}.')

          # Verify release UI does not accidentally retain diagnostic overlays.
          for forbidden in ('PCE ZIP LOAD DIAGNOSTIC', 'BG PNG OK', 'BG DEFAULT', 'render_load_debug();'):
              if forbidden in s:
                  raise SystemExit(f'Release frontend still contains visible diagnostic marker: {forbidden}')
          if '#define PCE_SHOW_DIAGNOSTICS 0' not in s:
              raise SystemExit('Release diagnostics switch was not disabled.')
          if 'static void render_load_error(void)' not in s:
              raise SystemExit('Friendly load-error screen is missing.')
          path.write_text(s)
          print('Release patch applied: diagnostics hidden, error screen simplified, background and CHT support preserved.')
          PY_RELEASE_PATCH
