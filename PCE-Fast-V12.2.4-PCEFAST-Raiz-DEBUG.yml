      - name: Instrument exact USB directory paths for on-screen debug
        shell: sh
        run: |
          set -eu
          python3 - <<'PY_DEBUG_PATH'
          from pathlib import Path
          p=Path('pce-only/pce_only.c')
          s=p.read_text()
          def replace_once(old,new):
              global s
              count=s.count(old)
              if count!=1: raise SystemExit(f'Expected one occurrence, got {count}: {old[:90]}')
              s=s.replace(old,new,1)
          replace_once('int d=fileXioDopen(folder),r;\n            nentries=0; selected=0;\n            if(d<0) return d;',
              'int d,r;\n            char dbgmsg[96];\n            snprintf(dbgmsg,sizeof(dbgmsg),"DOPEN PATH: %.65s",folder);\n            usb_progress(dbgmsg);\n            d=fileXioDopen(folder);\n            snprintf(dbgmsg,sizeof(dbgmsg),"DOPEN RESULT: %d",d);\n            usb_progress(dbgmsg);\n            nentries=0; selected=0;\n            if(d<0) return d;')
          replace_once('r=fileXioDread(d,&dirent_buf);\n              if(r<=0)break;',
              'usb_progress("DREAD ENTER");\n              r=fileXioDread(d,&dirent_buf);\n              if(r<=0)break;')
          replace_once('fileXioDclose(d);\n            qsort(entries,nentries,sizeof(entries[0]),cmp_entry);',
              'usb_progress("DCLOSE ENTER");\n            fileXioDclose(d);\n            usb_progress("QSORT ENTER");\n            qsort(entries,nentries,sizeof(entries[0]),cmp_entry);\n            usb_progress("SCAN COMPLETE");')
          p.write_text(s)
          print('Instrumented fileXioDopen with exact path and return value; no USB driver changes')
          PY_DEBUG_PATH
      - name: Verify release frontend and asset support before compiling
