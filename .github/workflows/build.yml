
name: Build FCEUmm PS2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache git make build-base

      - name: Verify PS2 toolchain
        run: |
          echo "Checking PS2 development tools..."
          command -v mips64r5900el-ps2-elf-gcc
          command -v make
          test -d "$PS2SDK"
          test -d "$GSKIT"

      - name: Download FCEUmm PS2
        run: |
          git clone --depth 1 \
            https://github.com/ps2homebrew/Fceumm-PS2.git \
            fceumm-ps2
          test -f fceumm-ps2/Makefile
          echo "Source code downloaded successfully!"

      - name: Build PS2 ELF
        working-directory: fceumm-ps2
        run: |
          make NOT_PACKED=1 -j2

      - name: Verify ELF
        run: |
          test -s fceumm-ps2/fceu.elf
          ls -lh fceumm-ps2/fceu.elf
          echo "ELF build completed successfully!"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-PS2-ELF
          path: fceumm-ps2/fceu.elf
          if-no-files-found: error
