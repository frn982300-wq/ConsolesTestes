name: Build PS2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download FCEUmm
        run: |
          apk add --no-cache git
          git clone --depth 1 https://github.com/libretro/fceumm.git fceumm
          ls -la fceumm

      - name: Build PS2
        run: |
          cd fceumm
          # PATCH: Fix missing stdlib.h bug in browser.c
          sed -i '1i #include <stdlib.h>' src/drivers/ps2/browser.c || true
          sed -i '1i #include <stdlib.h>' src/drivers/ps2/Reboot_ELF.c || true
          # Build ignoring warnings from old code
          make -f Makefile.libretro platform=ps2 -j4 CFLAGS="-Wno-implicit-function-declaration -fcommon -std=gnu99" CXXFLAGS="-Wno-implicit-function-declaration -fcommon"

      - name: Find ELF
        run: |
          find . -name "*.elf" -o -name "*.ELF"
          ls -lh fceumm/*.elf || ls -lh *.elf || true

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: fceumm-ps2
          path: |
            **/*.elf
          if-no-files-found: warn
