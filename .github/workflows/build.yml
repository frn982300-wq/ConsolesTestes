
name: Build Original FCEUmm PS2 0.3.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unmodified PS2 source
    runs-on: ubuntu-latest
    timeout-minutes: 35

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout original source
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          apk add --no-cache make build-base

      - name: Verify original source and toolchain
        run: |
          set -eu
          test -f Makefile.ps2
          test -f src/drivers/ps2/init.c
          test -d "$PS2SDK"
          test -d "$GSKIT"
          command -v mips64r5900el-ps2-elf-gcc
          command -v bin2c
          echo "Original source detected. No source patches will be applied."

      - name: Compile original FCEUmm ELF
        shell: sh
        run: |
          if make -f Makefile.ps2 fceu.elf > build.log 2>&1; then
            echo "Original ELF compiled successfully."
            tail -n 50 build.log
          else
            echo "Original build failed with the current PS2SDK."
            grep -n -m 30 -E 'fatal error:|error:|undefined reference|multiple definition|cannot find|Error [0-9]+' build.log || true
            tail -n 100 build.log
            exit 1
          fi

      - name: Pack original ELF if tool is available
        run: |
          set -eu
          if command -v ps2-packer >/dev/null 2>&1; then
            ps2-packer fceu.elf fceu-packed.elf
            echo "Packed ELF created."
          else
            echo "ps2-packer is unavailable; the unpacked ELF is still preserved."
          fi

      - name: Verify source files were not edited
        run: |
          git diff --exit-code -- Makefile.ps2 src
          test -s fceu.elf
          ls -lh fceu.elf
          if test -s fceu-packed.elf; then ls -lh fceu-packed.elf; fi

      - name: Upload original build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-original-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload original PS2 ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-original-0.3.3-ELF
          path: |
            fceu.elf
            fceu-packed.elf
          if-no-files-found: error
          
