
name: Build FCEUmm PS2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FCEUmm for PlayStation 2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache git make build-base

      - name: Verify PS2 development environment
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"

          command -v mips64r5900el-ps2-elf-gcc
          command -v make

          test -d "$PS2SDK"
          test -d "$GSKIT"

      - name: Clone FCEUmm PS2 repository
        run: |
          git clone --depth 1 \
            https://github.com/ps2homebrew/Fceumm-PS2.git \
            fceumm-ps2

          ls -la fceumm-ps2

      - name: Build PS2 ELF
        working-directory: fceumm-ps2
        run: |
          make NOT_PACKED=1 -j2

      - name: Verify ELF output
        run: |
          test -s fceumm-ps2/fceu.elf
          ls -lh fceumm-ps2/fceu.elf
          echo "ELF file generated successfully!"

      - name: Upload PS2 ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-PS2-ELF
          path: fceumm-ps2/fceu.elf
          if-no-files-found: error
          retention-days: 30
          
