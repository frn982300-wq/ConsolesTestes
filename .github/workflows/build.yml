        \ build logs and workflow steps.\\n' > artifact-staging/ELF-STATUS.txt\nfi\nfind artifact-staging -type\
        \ f -print\n"
    - name: Upload release ELF, source, and build logs (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: PCE-Fast-PS2-V12.2.4-Release-Optimized-Background-PNG-V12
