
name: Build FCEUmm PS2 exFAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS2 ELF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          apk add --no-cache make git unzip python3 build-base

      - name: Extract source package
        run: |
          set -eu
          test -s FCEUmm-PS2-exFAT-source.zip
          unzip -q FCEUmm-PS2-exFAT-source.zip
          test -f FCEUmm-PS2-exFAT/Makefile.ps2
          test -s FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbd.irx
          test -s FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbhdfsd.irx
          echo "Source files extracted successfully"

      - name: Verify PS2 toolchain
        run: |
          set -eu
          test -d "$PS2SDK"
          test -d "$GSKIT"
          command -v mips64r5900el-ps2-elf-gcc
          command -v bin2c

      - name: Patch legacy PS2SDK source
        working-directory: FCEUmm-PS2-exFAT
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path('Makefile.ps2')
          lines = makefile.read_text().splitlines(keepends=True)
          found = False
          for index, line in enumerate(lines):
              if line.startswith('PLATFORM_DEFINES ='):
                  lines[index] = line.rstrip('\n') + ' -DNEWLIB_PORT_AWARE\n'
                  found = True
                  break
          if not found:
              raise RuntimeError('PLATFORM_DEFINES was not found')
          makefile.write_text(''.join(lines))

          browser = Path('src/drivers/ps2/browser.c')
          source = browser.read_text()
          if 'fio_dirent_t buf;' not in source:
              raise RuntimeError('Expected legacy directory type was not found')
          source = source.replace('fio_dirent_t buf;', 'io_dirent_t buf;', 1)
          browser.write_text(source)

          config = Path('src/drivers/ps2/cnfsettings.c')
          source = config.read_text()
          for declaration in ('int true = 1;\n', 'int false = 0;\n'):
              if declaration not in source:
                  raise RuntimeError('Expected legacy Boolean declaration was not found')
              source = source.replace(declaration, '', 1)
          source = source.replace("(tp!='\\0')", "(*tp!='\\0')")
          for header in ('<stdlib.h>', '<fileio.h>', '<sys/fcntl.h>'):
              if '#include ' + header not in source:
                  source = '#include ' + header + '\n' + source
          config.write_text(source)

          main = Path('src/drivers/ps2/main.c')
          source = main.read_text()
          if source.count('#include <libjpg.h>') != 1:
              raise RuntimeError('Expected legacy JPEG header was not found')
          source = source.replace('#include <libjpg.h>\n', '', 1)
          if '#include <stdlib.h>' not in source:
              source = '#include <stdlib.h>\n' + source
          if '#include <malloc.h>' not in source:
              source = '#include <malloc.h>\n' + source

          start = source.find('    // Setup GUI Textures\n')
          end = source.find('    if (!(ret = FCEUI_Initialize()))', start)
          if start == -1 or end == -1 or 'jpgOpenFILE' not in source[start:end]:
              raise RuntimeError('Legacy JPEG loading section was not found')

          replacement = '''    // Setup GUI Textures
              if (strstr(FCEUSkin.bgTexture, ".png") != NULL) {
                  if (gsKit_texture_png(gsGlobal, &BG_TEX, FCEUSkin.bgTexture) < 0) {
                      printf("Error loading browser background PNG!\\n");
                      bgtex = 1;
                  }
              } else if (strstr(FCEUSkin.bgTexture, ".jpg") != NULL ||
                         strstr(FCEUSkin.bgTexture, ".jpeg") != NULL) {
                  if (gsKit_texture_jpeg(gsGlobal, &BG_TEX, FCEUSkin.bgTexture) < 0) {
                      printf("Error loading browser background JPEG!\\n");
                      bgtex = 1;
                  }
              } else {
                  bgtex = 1;
              }

              if (strstr(FCEUSkin.bgMenu, ".png") != NULL) {
                  if (gsKit_texture_png(gsGlobal, &MENU_TEX, FCEUSkin.bgMenu) < 0) {
                      printf("Error loading menu background PNG!\\n");
                      menutex = 1;
                  }
              } else if (strstr(FCEUSkin.bgMenu, ".jpg") != NULL ||
                         strstr(FCEUSkin.bgMenu, ".jpeg") != NULL) {
                  if (gsKit_texture_jpeg(gsGlobal, &MENU_TEX, FCEUSkin.bgMenu) < 0) {
                      printf("Error loading menu background JPEG!\\n");
                      menutex = 1;
                  }
              } else {
                  menutex = 1;
              }

          '''
          source = source[:start] + replacement + source[end:]
          if 'jpgOpenFILE' in source or '#include <libjpg.h>' in source:
              raise RuntimeError('Legacy JPEG calls still remain')
          main.write_text(source)
          print('PS2SDK and gsKit JPEG compatibility patches applied')
          PY

      - name: Build PS2 ELF
        working-directory: FCEUmm-PS2-exFAT
        shell: sh
        run: |
          if make -f Makefile.ps2 NOT_PACKED=1 -j1 > build.log 2>&1; then
            tail -n 40 build.log
          else
            echo "Build failed. Relevant compiler messages:"
            grep -n -E 'error:|undefined reference|No such file|Error [0-9]+' build.log || true
            echo "Last 160 lines of build log:"
            tail -n 160 build.log
            exit 1
          fi

      - name: Verify ELF output
        run: |
          test -s FCEUmm-PS2-exFAT/fceu.elf
          ls -lh FCEUmm-PS2-exFAT/fceu.elf

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-PS2-build-log
          path: FCEUmm-PS2-exFAT/build.log
          if-no-files-found: warn

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-PS2-exFAT-ELF
          path: FCEUmm-PS2-exFAT/fceu.elf
          if-no-files-found: error
