        \necho \"zlib include directory: $ZLIB_INCLUDE\"\necho \"Vorbis mode: $(cat pce-vorbis-mode.txt)\"\nSYS_TYPES_HEADER=\"\
        $PS2_ROOT/ee/mips64r5900el-ps2-elf/include/sys/types.h\"\nif [ ! -s \"$SYS_TYPES_HEADER\" ]; then\n  SYS_TYPES_HEADER=\"\
        $(find \"$PS2_ROOT/ee\" -path '*/mips64r5900el-ps2-elf/include/sys/types.h' -type f -print -quit 2>/dev/null\
        \ || true)\"\nfi\ntest -n \"$SYS_TYPES_HEADER\" && test -s \"$SYS_TYPES_HEADER\" || {\n  echo 'Could not\
        \ locate the PS2 newlib sys/types.h header.'; exit 1;\n}\necho \"Using explicit PS2 newlib types header:\
