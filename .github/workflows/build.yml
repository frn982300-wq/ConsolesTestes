
name: Beetle PCE Fast PS2 exFAT CPU Map V7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V7 PS2 CPU mapping diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: apk add --no-cache make build-base python3 unzip git

      - name: Extract working exFAT modules
        shell: sh
        run: |
          set -eu
          mkdir -p ps2-v7
          test -s FCEUmm-PS2-exFAT-integrated-2026.zip

          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbd.irx > ps2-v7/usbd.irx

          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbhdfsd.irx > ps2-v7/usbhdfsd.irx

          test -s ps2-v7/usbd.irx
          test -s ps2-v7/usbhdfsd.irx
          test -s "$PS2SDK/iop/irx/iomanX.irx"
          test -s "$PS2SDK/iop/irx/fileXio.irx"
          command -v bin2c

      - name: Generate PS2 V7 source and Makefile
        shell: sh
        run: |
          cat > ps2-v7/app.c <<'END_V7_C'
          /* PS2 exFAT V7: ROM bank mapping and HuC6280 reset-vector probe.
           * This is NOT the Beetle PCE Fast CPU core; no instructions execute.
           * Preserve the working V6 read-only USB and gamepad routines. */
          #include <gsKit.h>
          #include <dmaKit.h>
          #include <stddef.h>
          #include <sifrpc.h>
          #include <loadfile.h>
          #include <libpad.h>
          #include <sbv_patches.h>
          #include <iopheap.h>
          #include <fileXio_rpc.h>
          #include <io_common.h>
          #include <iox_stat.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <ctype.h>

          #define MAX_ITEMS 120
          #define VISIBLE 8
          #define PATH_MAX_LEN 512
          #define NAME_MAX_LEN 256
          #define CHUNK 16384
          #define ROM_MAX (8*1024*1024)
          #define ROM_BANK 8192

          static const char fontkeys[] = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/:.";
          static const unsigned long long fontbits[] = {
              0x4631fc62eULL, 0x3e317c62fULL, 0x78210843eULL, 0x3e318c62fULL, 0x7c217843fULL,
              0x04217843fULL, 0x3a31e843eULL, 0x4631fc631ULL, 0x7c842109fULL, 0x19294211cULL,
              0x452519531ULL, 0x7c2108421ULL, 0x4631ad771ULL, 0x4631cd671ULL, 0x3a318c62eULL,
              0x04217c62fULL, 0x59358c62eULL, 0x45257c62fULL, 0x3e107043eULL, 0x10842109fULL,
              0x3a318c631ULL, 0x11518c631ULL, 0x4775ac631ULL, 0x462a22a31ULL, 0x108422a31ULL,
              0x7c222221fULL, 0x3a33ae62eULL, 0x3884210c4ULL, 0x7c444422eULL, 0x3e107420fULL,
              0x211f4a988ULL, 0x3e107843fULL, 0x3a317842eULL, 0x08422221fULL, 0x3a317462eULL,
              0x3a10f462eULL, 0x0000f8000ULL, 0x042222210ULL, 0x008401080ULL, 0x18c000000ULL
          };

          static void text5(GSGLOBAL *gs,int x,int y,int scale,const char *s,u64 color)
          {
              int i,r,c,j;
              for (i=0;s[i];i++) {
                  char ch=(char)toupper((unsigned char)s[i]);
                  unsigned long long bitmap=0;
                  for(j=0;fontkeys[j];j++)
                      if(fontkeys[j]==ch){bitmap=fontbits[j];break;}

                  for(r=0;r<7;r++)
                      for(c=0;c<5;c++) {
                          if(bitmap & (1ULL << (r*5+c))) {
                              float px=(float)(x+(i*6+c)*scale);
                              float py=(float)(y+r*scale);
                              gsKit_prim_sprite(gs,px,py,px+scale,py+scale,1,color);
                          }
                      }
              }
          }

          extern unsigned char exfat_bdm_irx[],exfat_usb_irx[],iomanx_irx[],filexio_irx[];
          extern unsigned int size_exfat_bdm_irx,size_exfat_usb_irx,size_iomanx_irx,size_filexio_irx;

          static char pad_buffer[256] __attribute__((aligned(64)));
          static iox_dirent_t dir_entry __attribute__((aligned(64)));
          static iox_stat_t file_stat __attribute__((aligned(64)));
          static unsigned char io_buffer[CHUNK] __attribute__((aligned(64)));
          static unsigned char *rom=NULL;

          typedef struct {
              char name[NAME_MAX_LEN];
              int directory;
          } Item;

          static Item items[MAX_ITEMS];
          static int count=0,selected=0,screen=0,hidden=0;
          static int pad_ok=0,usb_ok=0,usb_error=0,listing_error=0;
          static unsigned oldkeys=0;
          static char current_path[PATH_MAX_LEN]="mass:/";
          static char full_path[PATH_MAX_LEN]="";

          static int size_rom=0,read_rom=0,blocks=0,last_pos=0,error_rom=0,loaded=0;
          static unsigned int disk_crc=0,ram_crc=0;
          static int header_skip=0,bank_count=0,vector_pc=0,vector_opcode=0;
          static int mapping_ok=0;
          static unsigned char mpr[8];

          static unsigned crc_step(unsigned crc,const unsigned char *data,int n)
          {
              int i,k;
              for(i=0;i<n;i++) {
                  crc^=data[i];
                  for(k=0;k<8;k++)
                      crc=(crc & 1u) ? ((crc>>1)^0xEDB88320u):(crc>>1);
              }
              return crc;
          }

          static int pad_start(void)
          {
              int a,b;
              SifInitRpc(0);
              a=SifLoadModule("rom0:XSIO2MAN",0,NULL);
              b=SifLoadModule("rom0:XPADMAN",0,NULL);
              if(a<0||b<0||padInit(0)!=1) return 0;
              pad_ok=padPortOpen(0,0,pad_buffer)!=0;
              return pad_ok;
          }

          static unsigned keys_new(void)
          {
              struct padButtonStatus buttons;
              int state;
              unsigned now,delta;
              if(!pad_ok) return 0;

              state=padGetState(0,0);
              if(state!=PAD_STATE_STABLE && state!=PAD_STATE_FINDCTP1) {
                  oldkeys=0;
                  return 0;
              }

              if(!padRead(0,0,&buttons)) return 0;
              now=(unsigned)(0xffffu^buttons.btns);
              delta=now & ~oldkeys;
              oldkeys=now;
              return delta;
          }

          static int module_load(const void *data,unsigned size)
          {
              int result=0;
              int id=SifExecModuleBuffer((void *)data,size,0,NULL,&result);
              if(id<0) return id;
              return result<0 ? result : 0;
          }

          static int usb_start(void)
          {
              int rc;
              if(usb_ok) return 0;

              SifLoadFileInit();
              SifInitIopHeap();
              sbv_patch_enable_lmb();

              rc=module_load(iomanx_irx,size_iomanx_irx);
              if(rc<0) return rc;

              rc=module_load(filexio_irx,size_filexio_irx);
              if(rc<0) return rc;

              rc=fileXioInit();
              if(rc<0) return rc;

              rc=module_load(exfat_bdm_irx,size_exfat_bdm_irx);
              if(rc<0) return rc;

              rc=module_load(exfat_usb_irx,size_exfat_usb_irx);
              if(rc<0) return rc;

              usb_ok=1;
              return 0;
          }

          static int is_rom(const char *name)
          {
              const char *ext=strrchr(name,'.');
              if(!ext||strlen(ext)!=4) return 0;

              return (tolower((unsigned char)ext[1])=='p' &&
                      tolower((unsigned char)ext[2])=='c' &&
                      tolower((unsigned char)ext[3])=='e') ||
                     (tolower((unsigned char)ext[1])=='s' &&
                      tolower((unsigned char)ext[2])=='g' &&
                      tolower((unsigned char)ext[3])=='x');
          }

          static int compare_items(const void *aa,const void *bb)
          {
              const Item *a=(const Item *)aa,*b=(const Item *)bb;
              int i;
              if(a->directory!=b->directory)
                  return b->directory-a->directory;

              for(i=0;i<NAME_MAX_LEN;i++) {
                  int x=tolower((unsigned char)a->name[i]);
                  int y=tolower((unsigned char)b->name[i]);
                  if(x!=y) return x-y;
                  if(!x) break;
              }
              return 0;
          }

          static int list_dir(void)
          {
              int d,rc,n,folder;
              count=0;
              hidden=0;
              selected=0;
              listing_error=0;

              d=fileXioDopen(current_path);
              if(d<0) {
                  listing_error=d;
                  return d;
              }

              for(n=0;n<2048;n++) {
                  memset(&dir_entry,0,sizeof(dir_entry));
                  rc=fileXioDread(d,&dir_entry);
                  if(rc<=0) {
                      if(rc<0) listing_error=rc;
                      break;
                  }

                  dir_entry.name[NAME_MAX_LEN-1]=0;

                  if(!dir_entry.name[0] ||
                     !strcmp(dir_entry.name,".") ||
                     !strcmp(dir_entry.name,".."))
                      continue;

                  folder=FIO_S_ISDIR(dir_entry.stat.mode);

                  if(!folder && !is_rom(dir_entry.name))
                      continue;

                  if(count>=MAX_ITEMS) {
                      hidden++;
                      continue;
                  }

                  strcpy(items[count].name,dir_entry.name);
                  items[count].directory=folder;
                  count++;
              }

              fileXioDclose(d);
              qsort(items,count,sizeof(Item),compare_items);
              return listing_error;
          }

          static void up_dir(void)
          {
              int n=(int)strlen(current_path);
              int root=!strncmp(current_path,"mass0:/",7)?7:6;

              if(n<=root) {
                  screen=0;
                  return;
              }

              if(current_path[n-1]=='/') n--;
              while(n>root && current_path[n-1]!='/') n--;
              current_path[n]=0;
              list_dir();
          }

          static void rom_free(void)
          {
              if(rom) {
                  free(rom);
                  rom=NULL;
              }
              loaded=0;
              mapping_ok=0;
          }

          /*
           * HuC6280 memory mapping preparation.
           * CPU has 64 KiB logical address space divided into 8 KiB pages.
           * Eight memory page registers choose the physical bank.
           * No instruction execution, I/O, IRQ or RAM mapping yet.
           */
          static unsigned char mapped_read(unsigned short address)
          {
              unsigned page=((unsigned)address)>>13;
              unsigned bank=mpr[page];
              unsigned offset=header_skip+bank*ROM_BANK+
                              (address & (ROM_BANK-1));

              if(!rom ||
                 bank>=(unsigned)bank_count ||
                 offset>=(unsigned)size_rom)
                  return 0xff;

              return rom[offset];
          }

          static void cpu_map_probe(void)
          {
              int i;

              header_skip=(size_rom % ROM_BANK == 512)?512:0;
              bank_count=(size_rom-header_skip)/ROM_BANK;

              for(i=0;i<8;i++) mpr[i]=0;
              mpr[7]=0;

              vector_pc=mapped_read(0xfffe) |
                        ((int)mapped_read(0xffff)<<8);

              vector_opcode=mapped_read((unsigned short)vector_pc);
              mapping_ok=(bank_count>0 && bank_count<=256);
          }

          static void rom_load(void)
          {
              int fd,rc,want,offset=0,close_rc;
              unsigned crc=0xffffffffu;

              rom_free();
              size_rom=0;
              read_rom=0;
              blocks=0;
              last_pos=-9999;
              disk_crc=0;
              ram_crc=0;
              error_rom=0;

              memset(&file_stat,0,sizeof(file_stat));

              rc=fileXioGetStat(full_path,&file_stat);
              if(rc<0) {
                  error_rom=rc;
                  return;
              }

              if(file_stat.hisize!=0 ||
                 file_stat.size==0 ||
                 file_stat.size>ROM_MAX) {
                  error_rom=-100;
                  return;
              }

              size_rom=(int)file_stat.size;
              rom=(unsigned char *)malloc((size_t)size_rom);

              if(!rom) {
                  error_rom=-101;
                  return;
              }

              fd=fileXioOpen(full_path,FIO_O_RDONLY);

              if(fd<0) {
                  error_rom=fd;
                  rom_free();
                  return;
              }

              rc=fileXioLseek(fd,0,FIO_SEEK_SET);
              if(rc!=0) {
                  error_rom=rc<0?rc:-102;
              }

              while(error_rom==0 && offset<size_rom) {
                  want=size_rom-offset;
                  if(want>CHUNK) want=CHUNK;

                  rc=fileXioRead(fd,io_buffer,want);
                  if(rc<=0 || rc>want) {
                      error_rom=rc<0?rc:-103;
                      break;
                  }

                  memcpy(rom+offset,io_buffer,(size_t)rc);
                  crc=crc_step(crc,io_buffer,rc);
                  offset+=rc;
                  blocks++;
                  read_rom=offset;
              }

              last_pos=fileXioLseek(fd,0,FIO_SEEK_CUR);
              close_rc=fileXioClose(fd);
              disk_crc=crc^0xffffffffu;

              if(error_rom==0 &&
                 (offset!=size_rom || last_pos!=size_rom))
                  error_rom=-104;

              if(error_rom==0 && close_rc<0)
                  error_rom=close_rc;

              if(error_rom==0) {
                  ram_crc=crc_step(0xffffffffu,rom,size_rom)^0xffffffffu;
                  if(ram_crc!=disk_crc)
                      error_rom=-106;
              }

              if(error_rom!=0) {
                  rom_free();
                  return;
              }

              loaded=1;
              cpu_map_probe();
          }

          static void select_file(void)
          {
              int n;
              if(count<=0 || selected>=count) return;

              n=snprintf(
                  full_path,sizeof(full_path),
                  "%s%s%s",
                  current_path,
                  items[selected].name,
                  items[selected].directory?"/":""
              );

              if(n<0 || n>=(int)sizeof(full_path)) {
                  listing_error=-120;
                  return;
              }

              if(items[selected].directory) {
                  strcpy(current_path,full_path);
                  list_dir();
              } else {
                  size_rom=0;
                  error_rom=0;
                  read_rom=0;
                  rom_free();
                  screen=2;
              }
          }

          static void compact(char *out,int len,const char *src)
          {
              int i;

              for(i=0;i<len-1 && src[i];i++) {
                  unsigned char x=(unsigned char)src[i];
                  out[i]=(x>=32 && x<127)
                      ?(char)toupper(x):'_';
              }

              out[i]=0;
          }

          static void draw(GSGLOBAL *gs)
          {
              u64 bg=GS_SETREG_RGBAQ(12,20,35,0x80,0);
              u64 panel=GS_SETREG_RGBAQ(29,46,63,0x80,0);
              u64 cyan=GS_SETREG_RGBAQ(56,218,186,0x80,0);
              u64 white=GS_SETREG_RGBAQ(236,243,249,0x80,0);
              u64 muted=GS_SETREG_RGBAQ(156,179,195,0x80,0);

              char line[100],name[40];
              int i,first;

              gsKit_clear(gs,bg);
              gsKit_prim_sprite(gs,42,35,51,128,1,cyan);

              text5(gs,67,52,3,"BEETLE PCE FAST",white);
              text5(gs,69,100,2,"PS2 EXFAT CPU MAP V7",cyan);

              if(screen==0) {
                  gsKit_prim_sprite(
                      gs,57,174,585,221,1,panel
                  );

                  text5(gs,80,185,3,"BROWSE USB ROMS",white);
                  text5(gs,80,255,2,"X OPEN BROWSER",cyan);

                  if(usb_error<0) {
                      snprintf(
                          line,sizeof(line),
                          "USB ERROR %d",usb_error
                      );
                      text5(gs,80,312,2,line,white);
                  }

              } else if(screen==1) {
                  compact(name,sizeof(name),current_path);
                  text5(gs,53,144,2,name,cyan);

                  first=selected-VISIBLE/2;
                  if(first<0) first=0;
                  if(first+VISIBLE>count)
                      first=count-VISIBLE;
                  if(first<0) first=0;

                  for(i=0;i<VISIBLE && first+i<count;i++) {
                      int at=first+i;
                      int y=179+i*25;

                      compact(name,25,items[at].name);

                      snprintf(
                          line,sizeof(line),
                          "%s %s",
                          items[at].directory?"D":"R",
                          name
                      );

                      if(at==selected) {
                          gsKit_prim_sprite(
                              gs,52,y-3,595,y+22,1,panel
                          );
                          gsKit_prim_sprite(
                              gs,52,y-3,57,y+22,1,cyan
                          );
                      }

                      text5(
                          gs,66,y,2,line,
                          at==selected?white:muted
                      );
                  }

                  if(count==0)
                      text5(
                          gs,72,200,2,
                          "NO ROMS OR FOLDERS",white
                      );

                  snprintf(
                      line,sizeof(line),
                      "ITEMS %d HIDDEN %d",
                      count,hidden
                  );

                  text5(gs,55,395,2,line,cyan);
                  text5(
                      gs,55,420,2,
                      "UP DOWN X OPEN O BACK",cyan
                  );

              } else {
                  const char *nameptr=strrchr(full_path,'/');
                  compact(
                      name,sizeof(name),
                      nameptr?nameptr+1:full_path
                  );

                  text5(
                      gs,66,149,3,
                      "CPU MAP PROBE V7",white
                  );

                  text5(gs,65,199,2,name,cyan);

                  snprintf(
                      line,sizeof(line),
                      "SIZE %d READ %d",
                      size_rom,read_rom
                  );
                  text5(gs,65,232,2,line,white);

                  snprintf(
                      line,sizeof(line),
                      "BLOCKS %d POS %d",
                      blocks,last_pos
                  );
                  text5(gs,65,259,2,line,white);

                  snprintf(
                      line,sizeof(line),
                      "CRC32 %08X",disk_crc
                  );
                  text5(gs,65,286,2,line,cyan);

                  if(loaded) {
                      snprintf(
                          line,sizeof(line),
                          "BANKS %d HEADER %d",
                          bank_count,header_skip
                      );
                      text5(gs,65,312,2,line,white);

                      snprintf(
                          line,sizeof(line),
                          "MPR7 00 RESET %04X",
                          vector_pc
                      );
                      text5(gs,65,337,2,line,white);

                      snprintf(
                          line,sizeof(line),
                          "FIRST OPCODE %02X",
                          vector_opcode
                      );
                      text5(gs,65,362,2,line,cyan);

                      text5(
                          gs,65,388,2,
                          "ROM IN RAM MAP READY",cyan
                      );

                  } else if(error_rom) {
                      snprintf(
                          line,sizeof(line),
                          "LOAD ERROR %d",error_rom
                      );
                      text5(gs,65,350,2,line,white);

                  } else {
                      text5(
                          gs,65,350,2,
                          "PRESS X TO LOAD ROM",cyan
                      );
                  }

                  text5(
                      gs,65,413,2,
                      "X LOAD O BACK NO CPU RUN",muted
                  );
              }
          }

          int main(int argc,char **argv)
          {
              GSGLOBAL *gs;
              unsigned buttons;

              (void)argc;
              (void)argv;

              gs=gsKit_init_global();
              if(!gs) return 1;

              gs->PSM=GS_PSM_CT16;
              gs->PSMZ=GS_PSMZ_16;
              gs->ZBuffering=GS_SETTING_OFF;

              dmaKit_init(
                  D_CTRL_RELE_OFF,
                  D_CTRL_MFD_OFF,
                  D_CTRL_STS_UNSPEC,
                  D_CTRL_STD_OFF,
                  D_CTRL_RCYC_8,
                  1<<DMA_CHANNEL_GIF
              );

              dmaKit_chan_init(DMA_CHANNEL_GIF);
              gsKit_init_screen(gs);
              gsKit_mode_switch(gs,GS_ONESHOT);

              pad_start();

              for(;;) {
                  buttons=keys_new();

                  if(screen==0 && (buttons & PAD_CROSS)) {
                      if(!usb_ok) {
                          draw(gs);
                          gsKit_queue_exec(gs);
                          gsKit_sync_flip(gs);
                          usb_error=usb_start();
                      }

                      if(usb_error==0) {
                          strcpy(current_path,"mass:/");

                          if(list_dir()<0) {
                              strcpy(current_path,"mass0:/");
                              if(list_dir()>=0)
                                  screen=1;
                          } else {
                              screen=1;
                          }
                      }

                  } else if(screen==1) {
                      if((buttons & PAD_UP) && count>0)
                          selected=(selected+count-1)%count;

                      if((buttons & PAD_DOWN) && count>0)
                          selected=(selected+1)%count;

                      if(buttons & PAD_CROSS)
                          select_file();

                      if(buttons & (PAD_CIRCLE|PAD_TRIANGLE))
                          up_dir();

                      if(buttons & PAD_SQUARE)
                          list_dir();

                  } else if(screen==2) {
                      if(buttons & PAD_CROSS) {
                          draw(gs);
                          gsKit_queue_exec(gs);
                          gsKit_sync_flip(gs);
                          rom_load();
                      }

                      if(buttons & (PAD_CIRCLE|PAD_TRIANGLE)) {
                          rom_free();
                          screen=1;
                      }
                  }

                  draw(gs);
                  gsKit_queue_exec(gs);
                  gsKit_sync_flip(gs);
              }
          }
          END_V7_C

          cat > ps2-v7/Makefile <<'END_V7_MAKE'
          EE_BIN = Beetle-PCE-Fast-EXFAT-CPU-MAP-V7.ELF
          EE_OBJS = app.o exfat_bdm.o exfat_usb.o iomanx.o filexio.o
          EE_CFLAGS += -O2 -G0 -Wall -DNEWLIB_PORT_AWARE
          EE_INCS += -I$(GSKIT)/include
          EE_LDFLAGS += -L$(GSKIT)/lib
          EE_LIBS += -lgskit -ldmakit -lpad -lfileXio -lpatches -lm

          all: $(EE_BIN)

          clean:
          	rm -f $(EE_BIN) $(EE_OBJS)

          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          END_V7_MAKE

      - name: Embed PS2 IRX modules
        shell: sh
        run: |
          set -eu
          cd ps2-v7

          bin2c usbd.irx exfat_bdm.c exfat_bdm_irx
          bin2c usbhdfsd.irx exfat_usb.c exfat_usb_irx

          bin2c "$PS2SDK/iop/irx/iomanX.irx" iomanx.c iomanx_irx
          bin2c "$PS2SDK/iop/irx/fileXio.irx" filexio.c filexio_irx

      - name: Compile PS2 ELF
        working-directory: ps2-v7
        shell: sh
        run: |
          if make -j2 > build.log 2>&1; then
            ls -lh Beetle-PCE-Fast-EXFAT-CPU-MAP-V7.ELF
          else
            cat build.log
            exit 1
          fi

      - name: Verify MIPS ELF
        working-directory: ps2-v7
        run: |
          python3 - <<'PY'
          import pathlib, struct

          f = pathlib.Path('Beetle-PCE-Fast-EXFAT-CPU-MAP-V7.ELF')
          b = f.read_bytes()[:20]

          assert b[:4] == b'\x7fELF'
          assert b[4:6] == bytes([1, 1])
          assert struct.unpack_from('<H', b, 18)[0] == 8

          print('PS2 MIPS ELF OK:', f.stat().st_size)
          PY

      - name: Download official Beetle PCE Fast source for next port stage
        if: success()
        shell: sh
        run: |
          if git clone --depth 1 https://github.com/libretro/beetle-pce-fast-libretro.git official-pce-fast; then
            git -C official-pce-fast rev-parse HEAD > official-commit.txt

            tar czf official-pce-fast-reference.tar.gz \
              -C official-pce-fast mednafen/pce_fast COPYING

            echo 'Official source archived for CPU port; not linked into this ELF.'
          else
            echo 'Official source download unavailable; PS2 ELF remains valid.'
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beetle-V7-build-log
          path: ps2-v7/build.log
          if-no-files-found: warn

      - name: Upload ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Beetle-PCE-Fast-EXFAT-CPU-MAP-V7
          path: ps2-v7/Beetle-PCE-Fast-EXFAT-CPU-MAP-V7.ELF
          if-no-files-found: error

      - name: Upload official CPU reference sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Official-Beetle-PCE-Fast-reference
          path: |
            official-commit.txt
            official-pce-fast-reference.tar.gz
          if-no-files-found: ignore
