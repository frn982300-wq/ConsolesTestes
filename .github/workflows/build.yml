
name: Beetle PCE Fast PS2 exFAT Speed Mode ROM Trace V11

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V11 CPU clock mode and ROM trace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -eu
          apk add --no-cache make build-base python3 unzip

      - name: Extract working exFAT drivers
        shell: sh
        run: |
          set -eu
          mkdir -p ps2-v11
          test -s FCEUmm-PS2-exFAT-integrated-2026.zip
          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbd.irx \
            > ps2-v11/usbd.irx
          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbhdfsd.irx \
            > ps2-v11/usbhdfsd.irx
          test -s ps2-v11/usbd.irx
          test -s ps2-v11/usbhdfsd.irx
          test -s "$PS2SDK/iop/irx/iomanX.irx"
          test -s "$PS2SDK/iop/irx/fileXio.irx"
          command -v bin2c

      - name: Restore full embedded V11 source
        shell: sh
        run: |
          set -eu
          # Complete V11 C source embedded as gzip + base64.
