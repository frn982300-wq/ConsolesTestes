name: PCE Fast V12.2.4 - Embedded 640x480 Background
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    name: RELEASE V12 Optimized - Background PNG + External CHT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ps2dev/ps2dev:latest
    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4
    - name: Initialize artifact staging (always available)
      shell: sh
      run: 'set -eu

        mkdir -p artifact-staging

        printf ''Workflow started. Build outputs will be collected even if a later step fails.\n'' > artifact-staging/workflow-status.txt

        mkdir -p ''artifact-staging/PCEFAST/cheats''

        cat > ''artifact-staging/PCEFAST/cheats/Ninja Spirit (USA).cht'' <<''NINJA_CHT''

        cheats = "5"

        cheat0_desc = "Infinite Energy"

        cheat0_code = "1f17c9:05"

        cheat0_enable = "false"

        cheat1_desc = "Infinite Lives"

        cheat1_code = "1f0b68:03"

        cheat1_enable = "false"

        cheat2_desc = "Invincibility"

        cheat2_code = "1f1dee:04"

        cheat2_enable = "false"

        cheat3_desc = "Powered Up Weapons"

        cheat3_code = "1f1e58:01"

        cheat3_enable = "false"

        cheat4_desc = "Spirit Doubles"

        cheat4_code = "1f184c:67"

        cheat4_enable = "false"

        NINJA_CHT

        cat >> artifact-staging/workflow-status.txt <<''STATUS''

        Variant V12 RELEASE: based on the user-confirmed button remap, turbo, fast browser, ZIP/exFAT, covers, save/load
        states, and universal built-in CHT database. Adds optional 640x480 background PNG support loaded once after
        USB/exFAT initialization from mass:/PCEFAST/background.png, with mass0:/PCEFAST/background.png as alias
        fallback. Invalid/missing image silently keeps the original blue background. Adds external CHT loading from
        mass:/PCEFAST/cheats/, mass:/cheats/, or a game-folder cheats/ directory. External files use Libretro-style
        cheatN_desc/code/enable lines; only validated RAM byte-write codes are accepted and all start OFF. For Ninja
        Spirit (USA).zip, use PCEFAST/cheats/Ninja Spirit (USA).cht. If no valid external CHT is found, the embedded
        per-game database remains the fallback. Debug source labels are hidden in the release UI.

        Existing database: 531 CHT files, 1700 source records, 1599 unique supported byte-write entries. 70 rumble/event
        records and 33 non-byte/out-of-range records are excluded intentionally.

        Background support: place the user-selected 640x480, 8-bit, non-interlaced PNG at PCEFAST/background.png
        on the exFAT USB drive. The frontend supports grayscale, RGB, grayscale-alpha, RGBA, and indexed PNG color
        types; missing/invalid files retain the original blue fallback. Background is rendered on title/menu screens,
        not over gameplay video.

        ZIP support: browser lists .pce and .zip; ZIP must contain a .pce member, be single-disk and non-encrypted,
        and use stored or DEFLATE compression. ZIP and extracted ROM are limited to 8 MiB. If the core requires
        a full path, extracted ROM is written to a unique temporary .PCE in the same USB folder. PNG cover support:
        look for 200x200 8-bit non-interlaced RGB/RGBA/indexed PNGs in mass:/images/ or mass0:/images/, with a current-folder
        images/ fallback; filename must match the game filename without .pce/.zip. Browser hides images/ and displays
        titles only on the left and the cover on the right.

        STATUS

        '
    - name: Install tools
      shell: sh
      run: 'set -eu

        apk add --no-cache git make python3 build-base unzip binutils

        '
    - name: Fetch tested PS2 PCE Fast integration
      shell: sh
      run: 'set -eu

        git clone --depth 1 https://github.com/itsveenee/SNESticleAurora.git aurora

        git -C aurora submodule update --init --depth 1 src/third_party/beetle-pce-fast

        test -s aurora/Makefile

        test -s aurora/tools/Makefile.beetle-pce-fast-ps2

        test -s aurora/src/third_party/beetle-pce-fast/libretro.c

        git -C aurora rev-parse HEAD > aurora-revision.txt

        '
    - name: Verify Aurora GS-native color layout
      shell: sh
      run: 'set -eu

        VIDEO_HEADER=aurora/src/third_party/beetle-pce-fast/mednafen/video.h

        CORE_MAKEFILE=aurora/tools/Makefile.beetle-pce-fast-ps2

        test -s "$VIDEO_HEADER" || { echo ''PCE video.h not found''; exit 1; }

        grep -q ''AURORA_PS2_PCE_FAST'' "$VIDEO_HEADER" || { echo ''Expected Aurora PS2 color path not found'';
        exit 1; }

        grep -q ''RED_SHIFT   0'' "$VIDEO_HEADER" || { echo ''Expected GS-native red bit layout not found''; exit
        1; }

        grep -q ''GREEN_SHIFT 5'' "$VIDEO_HEADER" || { echo ''Expected GS-native green bit layout not found''; exit
        1; }

        grep -q ''BLUE_SHIFT  10'' "$VIDEO_HEADER" || { echo ''Expected GS-native blue bit layout not found''; exit
        1; }

        grep -q ''0x8000u'' "$VIDEO_HEADER" || { echo ''Expected opaque alpha bit for GS CT16 not found''; exit
        1; }

        grep -q -- ''-DAURORA_PS2_PCE_FAST=1'' "$CORE_MAKEFILE" || { echo ''Aurora PS2 core define missing''; exit
        1; }

        grep -q ''^DEBUG := 0'' "$CORE_MAKEFILE" || { echo ''Release core must have DEBUG := 0''; exit 1; }

        grep -q -- ''-O3'' "$CORE_MAKEFILE" || { echo ''Core -O3 optimization flag missing''; exit 1; }

        grep -q -- ''-DNDEBUG'' "$CORE_MAKEFILE" || { echo ''Core NDEBUG release flag missing''; exit 1; }

        grep -q -- ''-ffast-math'' "$CORE_MAKEFILE" || { echo ''Core optimized math flag missing''; exit 1; }

        echo ''Verified: source pixels are opaque GS-native A1B5G5R5; direct CT16 upload path is valid.''

        '
    - name: Build ONLY the original PC Engine core archive
      shell: sh
      run: "set -eu\nBASE=\"$(pwd)/aurora\"\nTARGET=\"$BASE/build/pce/beetle_pce_fast_libretro_ps2.a\"\necho \"\
        Building PCE library: $TARGET\"\nif make -C aurora -j2 \"$TARGET\" > core-build.log 2>&1; then\n  echo 'Original\
        \ Aurora PCE core build completed.'\nelse\n  echo 'Failed to build the isolated Aurora PCE core.'\n  tail\
        \ -n 150 core-build.log\n  exit 1\nfi\nRAW=\"$BASE/build/beetle-pce-fast-src/mednafen_pce_fast_libretro_ps2_raw.a\"\
        \ntest -s \"$RAW\" || { echo 'Raw PCE archive was not produced'; exit 1; }\nmips64r5900el-ps2-elf-nm -g\
        \ --defined-only \"$RAW\" > pce-symbols.txt\ngrep -Eq '[[:space:]]retro_run$' pce-symbols.txt || {\n  echo\
        \ 'Raw archive does not export the expected Libretro API.'\n  exit 1\n}\nfor symbol in retro_serialize_size\
        \ retro_serialize retro_unserialize retro_get_memory_data retro_get_memory_size; do\n  grep -Eq \"[[:space:]]${symbol}$\"\
        \ pce-symbols.txt || {\n    echo \"Required Libretro API missing from core: ${symbol}\"\n    exit 1\n  }\n\
        done\necho 'Verified: retro_run, Save/Load State APIs, and safe system-RAM access APIs; frontend avoids\
        \ retro_cheat_reset/set.'\necho 'Save State test: open menu with L1+R1+SELECT; D-pad moves; Cross confirms;\
        \ Circle returns. Test all five slots on USB exFAT.'\n"
    - name: Extract the tested V10/V11 exFAT driver pair
      shell: sh
      run: "set -eu\nmkdir -p pce-only\ntest -s FCEUmm-PS2-exFAT-integrated-2026.zip || {\n  echo 'Missing FCEUmm-PS2-exFAT-integrated-2026.zip\
        \ in repository root.'\n  echo 'Add the same driver archive used by the working V10/V11 workflow.'\n  exit\
        \ 1\n}\nunzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \\\n  FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbd.irx\
        \ \\\n  > pce-only/usbd.irx\nunzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \\\n  FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbhdfsd.irx\
        \ \\\n  > pce-only/usbhdfsd.irx\ntest -s pce-only/usbd.irx\ntest -s pce-only/usbhdfsd.irx\ntest -s \"$PS2SDK/iop/irx/iomanX.irx\"\
        \ntest -s \"$PS2SDK/iop/irx/fileXio.irx\"\necho 'Extracted tested V10/V11 exFAT pair: usbd.irx + usbhdfsd.irx.'\n"
