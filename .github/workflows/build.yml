name: PCE Fast PS2 V12.2.4 - Turbo I II Debug Fix (Square Triangle)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PS2 SDK
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget unzip python3
          git clone https://github.com/ps2dev.git
          cd ps2dev
          ./build.sh

      - name: Clone Aurora
        run: |
          git clone --recursive https://github.com/itsveenee/SNESticleAurora.git
          cd SNESticleAurora
          git submodule update --init --recursive

      - name: Verify GS-native Color
        run: |
          grep -n "RED_SHIFT\|GREEN_SHIFT\|BLUE_SHIFT\|CT16" SNESticleAurora/beetle-pce-fast/video.h || true
          # Expected:
          # RED_SHIFT 0
          # GREEN_SHIFT 5
          # BLUE_SHIFT 10
          # Alpha 0x8000u

      - name: Build Core Only
        run: |
          cd SNESticleAurora/beetle-pce-fast
          make -f Makefile.libretro platform=ps2 -j$(nproc)
          ls -lh beetle_pce_fast_libretro_ps2.a
          nm beetle_pce_fast_libretro_ps2.a | grep retro_run

      - name: Get exFAT Drivers V10/V11
        run: |
          unzip -o FCEUmm-PS2-exFAT-integrated-2026.zip -d exfat_drivers
          cp exfat_drivers/usbd.irx .
          cp exfat_drivers/usbhdfsd.irx .
          cp $PS2SDK/iop/irx/iomanX.irx .
          cp $PS2SDK/iop/irx/fileXio.irx .

      - name: Generate Frontend PS2 - pce_only.c
        run: |
          cat > pce_only.c << 'EOF'
          #include <gsKit.h>
          #include <dmaKit.h>
          #include <libpad.h>
          #include <audsrv.h>
          #include <stdio.h>
          #include <string.h>
          
          #define PCE_SHOW_DIAGNOSTICS 1
          #define MAX_FILES 128
          #define MAX_ROM_SIZE 8388608
          
          // Turbo I / II - Hold to fire ~15 pulses/sec
          // Period 4 frames
