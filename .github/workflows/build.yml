
name: Beetle PCE Fast PS2 V8 CPU Self Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS2 V8 HuC6280 CPU subset test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout V8 and previous working V7
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install tools
        run: apk add --no-cache make build-base python3 unzip git

      - name: Recover working V7 source and add V8 CPU test
        shell: sh
        run: |
          set -eu
          mkdir -p ps2-v8
          git show HEAD^:.github/workflows/build.yml > previous_v7.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          previous = Path('previous_v7.yml').read_text()
          match = re.search(
              r"(?ms)^ {10}cat > ps2-v7/app\.c <<'END_V7_C'\n(.*?)^ {10}END_V7_C$",
              previous,
          )
          if not match:
              raise SystemExit('ERROR: The previous commit is not the working V7 workflow. Do not replace V7.')

          source = '\n'.join(
              line[10:] if line.startswith(' ' * 10) else line
              for line in match.group(1).splitlines()
          ) + '\n'

          cpu = r'''
          /* V8: bounded HuC6280 instruction subset. NOT full Mednafen CPU. */
          typedef struct {
              unsigned short pc;
              unsigned char a,x,y,s,p,mpr[8],ram[8192];
              int cycles,steps,error;
          } CPU8;
          static CPU8 cpu8;
          static int cpu_result=0;

          static unsigned char cpu_read(unsigned short addr) {
              unsigned bank=cpu8.mpr[addr>>13];
              unsigned off=addr&8191u;
              unsigned loc;
              if(bank==0xf8) return cpu8.ram[off];
              if(!rom || bank>=(unsigned)bank_count) return 0xff;
              loc=(unsigned)header_skip+bank*8192u+off;
              return loc<(unsigned)size_rom ? rom[loc] : 0xff;
          }
          static void cpu_write(unsigned short addr,unsigned char val) {
              if(cpu8.mpr[addr>>13]==0xf8) cpu8.ram[addr&8191u]=val;
          }
          static unsigned char fetch8(void) {
              unsigned char value=cpu_read(cpu8.pc);
              cpu8.pc=(unsigned short)(cpu8.pc+1);
              return value;
          }
          static void zn8(unsigned char value) {
              cpu8.p=(unsigned char)(cpu8.p & ~(0x80u|0x02u));
              if(!value) cpu8.p|=0x02;
              if(value&0x80) cpu8.p|=0x80;
          }
          static int step8(void) {
              unsigned char op=fetch8();
              unsigned lo,hi;
              switch(op) {
                  case 0xa9: /* LDA #imm */
                      cpu8.a=fetch8();zn8(cpu8.a);cpu8.cycles+=2;break;
                  case 0xaa: /* TAX */
                      cpu8.x=cpu8.a;zn8(cpu8.x);cpu8.cycles+=2;break;
                  case 0xe8: /* INX */
                      ++cpu8.x;zn8(cpu8.x);cpu8.cycles+=2;break;
                  case 0x8e: /* STX absolute */
                      lo=fetch8();hi=fetch8();
                      cpu_write((unsigned short)(lo|(hi<<8)),cpu8.x);
                      cpu8.cycles+=4;break;
                  case 0xad: /* LDA absolute */
                      lo=fetch8();hi=fetch8();
                      cpu8.a=cpu_read((unsigned short)(lo|(hi<<8)));
                      zn8(cpu8.a);cpu8.cycles+=4;break;
                  case 0xea: /* NOP */
                      cpu8.cycles+=2;break;
                  default:cpu8.error=op;return -1;
              }
              ++cpu8.steps;
              return 0;
          }
          static void selftest8(void) {
              static const unsigned char code[]={
                  0xa9,0x2a,0xaa,0xe8,0x8e,0x00,0x22,0xad,0x00,0x22,0xea
              };
              int i;
              cpu_result=0;
              memset(&cpu8,0,sizeof(cpu8));
              cpu8.pc=0x2100;cpu8.s=0xff;cpu8.p=0x04;
              cpu8.mpr[1]=0xf8;
              memcpy(&cpu8.ram[0x100],code,sizeof(code));
              for(i=0;i<6;++i) {
                  if(step8()<0) {cpu_result=-1;return;}
              }
              cpu_result=(cpu8.pc==0x210b && cpu8.a==0x2b &&
                          cpu8.x==0x2b && cpu8.ram[0x200]==0x2b &&
                          cpu8.steps==6 && cpu8.cycles==16) ? 1:-2;
          }
          '''

          def replace_once(old, new):
              global source
              if source.count(old) != 1:
                  raise SystemExit('ERROR: V7 source changed; missing marker: ' + old[:65])
              source = source.replace(old, new, 1)

          replace_once('static void select_file(void)', cpu + '\nstatic void select_file(void)')
          replace_once('PS2 EXFAT CPU MAP V7', 'PS2 EXFAT CPU TEST V8')
          replace_once('CPU MAP PROBE V7', 'CPU MAP PROBE V8')
          replace_once('X LOAD O BACK NO CPU RUN', 'X LOAD TRI CPU O BACK')
          replace_once(
              "    } else {\n        const char *nameptr=strrchr(full_path,'/');",
              "    } else if(screen==2) {\n        const char *nameptr=strrchr(full_path,'/');",
          )
          replace_once(
              '        text5(gs,65,413,2,"X LOAD TRI CPU O BACK",muted);\n    }\n}\nint main',
              '''        text5(gs,65,413,2,"X LOAD TRI CPU O BACK",muted);
              } else if(screen==3) {
                  text5(gs,65,151,3,"CPU SELFTEST V8",white);
                  text5(gs,65,202,2,"6 HUC6280 OPCODES IN RAM",cyan);
                  snprintf(line,sizeof(line),"PC %04X STEPS %d",cpu8.pc,cpu8.steps);
                  text5(gs,65,244,2,line,white);
                  snprintf(line,sizeof(line),"A %02X X %02X Y %02X P %02X",
                           cpu8.a,cpu8.x,cpu8.y,cpu8.p);
                  text5(gs,65,273,2,line,white);
                  snprintf(line,sizeof(line),"RAM2200 %02X CYCLES %d",
                           cpu8.ram[0x200],cpu8.cycles);
                  text5(gs,65,303,2,line,white);
                  if(cpu_result==1) text5(gs,65,348,2,"CPU TEST PASS",cyan);
                  else {
                      snprintf(line,sizeof(line),"CPU TEST ERROR %d",cpu_result);
                      text5(gs,65,348,2,line,white);
                  }
                  text5(gs,65,392,2,"X RETEST O BACK",muted);
              }
              }
              int main''',
          )
          replace_once(
              "            if(buttons & (PAD_CIRCLE|PAD_TRIANGLE)) {rom_free();screen=1;}\n        }\n",
              """            if((buttons & PAD_TRIANGLE) && loaded && mapping_ok) {
                  selftest8();screen=3;
              }
              if(buttons & PAD_CIRCLE) {rom_free();screen=1;}
          } else if(screen==3) {
              if(buttons & PAD_CROSS) selftest8();
              if(buttons & (PAD_CIRCLE|PAD_TRIANGLE)) screen=2;
          }
          """,
          )

          Path('ps2-v8/app.c').write_text(source)
          Path('ps2-v8/Makefile').write_text('''EE_BIN = Beetle-PCE-Fast-CPU-TEST-V8.ELF
          EE_OBJS = app.o exfat_bdm.o exfat_usb.o iomanx.o filexio.o
          EE_CFLAGS += -O2 -G0 -Wall -DNEWLIB_PORT_AWARE
          EE_INCS += -I$(GSKIT)/include
          EE_LDFLAGS += -L$(GSKIT)/lib
          EE_LIBS += -lgskit -ldmakit -lpad -lfileXio -lpatches -lm
          all: $(EE_BIN)
          clean:
          \trm -f $(EE_BIN) $(EE_OBJS)
          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          '''.replace('          ', ''))
          print('V8 source and Makefile created; V7 preserved as base.')
          PY

      - name: Extract exFAT modules from working ZIP
        shell: sh
        run: |
          set -eu
          test -s FCEUmm-PS2-exFAT-integrated-2026.zip
          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbd.irx > ps2-v8/usbd.irx
          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbhdfsd.irx > ps2-v8/usbhdfsd.irx
          test -s ps2-v8/usbd.irx
          test -s ps2-v8/usbhdfsd.irx

      - name: Embed IRX drivers
        shell: sh
        run: |
          set -eu
          cd ps2-v8
          bin2c usbd.irx exfat_bdm.c exfat_bdm_irx
          bin2c usbhdfsd.irx exfat_usb.c exfat_usb_irx
          bin2c "$PS2SDK/iop/irx/iomanX.irx" iomanx.c iomanx_irx
          bin2c "$PS2SDK/iop/irx/fileXio.irx" filexio.c filexio_irx

      - name: Compile ELF
        working-directory: ps2-v8
        shell: sh
        run: |
          if make -j2 > build.log 2>&1; then
            ls -lh Beetle-PCE-Fast-CPU-TEST-V8.ELF
          else
            cat build.log
            exit 1
          fi

      - name: Verify PS2 ELF
        working-directory: ps2-v8
        shell: sh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('Beetle-PCE-Fast-CPU-TEST-V8.ELF')
          b=p.read_bytes()[:20]
          assert b[:4] == b'\x7fELF'
          assert b[4:6] == bytes([1,1])
          assert struct.unpack_from('<H',b,18)[0] == 8
          print('PS2 ELF validated',p.stat().st_size)
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8-PS2-build-log
          path: ps2-v8/build.log
          if-no-files-found: warn

      - name: Upload ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Beetle-PCE-Fast-CPU-TEST-V8
          path: ps2-v8/Beetle-PCE-Fast-CPU-TEST-V8.ELF
          if-no-files-found: error
