        \ exit 1;\n}\nGSKIT_LIBDIR=\"$(dirname \"$GSKIT_LIB\")\"\nDMAKIT_LIBDIR=\"$(dirname \"$DMAKIT_LIB\")\"\n\
        echo \"Libretro include: $LIBRETRO_INC\"\necho \"gsKit include: $GSKIT_INCLUDE\"\necho \"gsKit library directory:\
