    - name: Embed verified 640x480 background into ELF source
      run: "set -eu\npython3 - <<'PY_EMBED_BACKGROUND'\nfrom pathlib import Path\nimport zlib\nsrc=Path('pce-only/pce_only.c')\n\
        s=src.read_text()\nblob=zlib.decompress(Path('pcefast_background_640x480.rgb555.zlib').read_bytes())\nassert\
        \ len(blob)==640*480*2, 'Incorrect embedded image dimensions'\n# Generate native uint16_t values to avoid\
        \ alignment and endianness surprises.\nvalues=[int.from_bytes(blob[i:i+2], 'little') for i in range(0,len(blob),2)]\n\
        lines=[]\nfor i in range(0,len(values),16):\n    lines.append('  '+','.join('0x%04x'%v for v in values[i:i+16])+',')\n\
        Path('pce-only/embedded_background.inc').write_text('static const uint16_t embedded_background_640[640u*480u]\
        \ = {\\n'+ '\\n'.join(lines)+'\\n};\\n')\nanchor='static void load_background(void) {'\nassert s.count(anchor)==1,\
        \ 'Cannot find unique background loader'\ns=s.replace(anchor, '#include \"embedded_background.inc\"\\n'+anchor,1)\n\
        start=s.index(anchor)\nend=s.index('\\nstatic void draw_background(void)',start)\nreplacement=\"\"\"static\
        \ void load_background(void) {\n  int y;\n  if(background_checked) return;\n  background_checked=1;\n  background_loaded=0;\n\
        \  background_error=0;\n  if(!background_tex_ready) { background_error=1; return; }\n  memset(background_pixels,\
        \ 0, sizeof(background_pixels));\n  for(y=0; y<480; ++y) {\n    memcpy(&background_pixels[(size_t)y*BACKGROUND_TEX_W],\n\
        \           &embedded_background_640[(size_t)y*640u], 640u*sizeof(uint16_t));\n  }\n  gsKit_texture_upload(gs,\
        \ &background_tex);\n  background_loaded=1;\n}\n\"\"\"\ns=s[:start]+replacement+s[end:]\nsrc.write_text(s)\n\
        print('Embedded 640x480 RGB555 texture with 1024-pixel GS row stride.')\nPY_EMBED_BACKGROUND\n"
    - name: Verify release frontend and asset support before compiling
