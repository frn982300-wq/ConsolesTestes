        \ <sys/time.h>\nint main(void) { mode_t mode = 0; dev_t device = 0; struct timeval tv = {0, 0}; return (int)mode\
        \ + (int)device + (int)tv.tv_sec; }\nPS2_TYPES_PROBE\nif mips64r5900el-ps2-elf-gcc -D_EE -DNEWLIB_PORT_AWARE\
