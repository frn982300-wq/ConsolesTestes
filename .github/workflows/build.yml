
name: Diagnose Original FCEUmm PS2 0.3.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build original PS2 source
    runs-on: ubuntu-latest
    timeout-minutes: 35

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -eu
          apk add --no-cache make build-base

      - name: Check source files and toolchain
        shell: sh
        run: |
          set -eu
          echo "Current directory:"
          pwd
          echo "Repository contents:"
          ls -la

          for file in Makefile.ps2 src/drivers/ps2/init.c; do
            if test -f "$file"; then
              echo "FOUND: $file"
            else
              echo "ERROR: Missing original source file: $file"
              echo "Possible Makefiles:"
              find . -maxdepth 4 -name Makefile.ps2 -print
              exit 1
            fi
          done

          for variable in PS2SDK GSKIT; do
            eval "directory=\${$variable:-}"
            if test -n "$directory" && test -d "$directory"; then
              echo "FOUND: $variable=$directory"
            else
              echo "ERROR: Missing or invalid $variable directory"
              exit 1
            fi
          done

          for tool in mips64r5900el-ps2-elf-gcc bin2c make; do
            if command -v "$tool"; then
              echo "FOUND: $tool"
            else
              echo "ERROR: Missing build tool: $tool"
              exit 1
            fi
          done

          echo "Original source verification completed."

      - name: Compile original source without patches
        shell: sh
        run: |
          if make -f Makefile.ps2 fceu.elf > build.log 2>&1; then
            echo "Original ELF compiled successfully."
            tail -n 60 build.log
          else
            echo "Original source did not compile with this PS2SDK."
            grep -n -m 40 -E 'fatal error:|error:|undefined reference|multiple definition|cannot find|No such file|Error [0-9]+' build.log || true
            tail -n 100 build.log
            exit 1
          fi

      - name: Verify ELF and unchanged source
        shell: sh
        run: |
          set -eu
          test -s fceu.elf
          git diff --exit-code -- Makefile.ps2 src
          ls -lh fceu.elf

      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-fceumm-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload original ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: original-fceumm-ps2-elf
          path: fceu.elf
          if-no-files-found: error
