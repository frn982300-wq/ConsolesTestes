name: PCE Fast PS2 V12.2.5 - Video Format and Audio Buffer Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PCE Fast V12.2.5 ELF and publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Initialize artifact staging (always available)
        shell: sh
        run: |
          set -eu
          mkdir -p artifact-staging
          printf 'Workflow started. Build outputs will be collected even if a later step fails.\n' > artifact-staging/workflow-status.txt
          printf 'Variant: V12.2.5 keeps V12.2.4 input/USB support; adds pixel-pitch format guard, video diagnostics, and buffered audio output\n' >> artifact-staging/workflow-status.txt

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install tools
        shell: sh
        run: |
          set -eu
          apk add --no-cache git make python3 build-base unzip binutils

      - name: Fetch tested PS2 PCE Fast integration
        shell: sh
        run: |
          set -eu
          git clone --depth 1 https://github.com/itsveenee/SNESticleAurora.git aurora
          git -C aurora submodule update --init --depth 1 src/third_party/beetle-pce-fast
          test -s aurora/Makefile
          test -s aurora/tools/Makefile.beetle-pce-fast-ps2
          test -s aurora/src/third_party/beetle-pce-fast/libretro.c
          git -C aurora rev-parse HEAD > aurora-revision.txt

      - name: Build ONLY the original PC Engine core archive
        shell: sh
        run: |
          set -eu
          BASE="$(pwd)/aurora"
          TARGET="$BASE/build/pce/beetle_pce_fast_libretro_ps2.a"
          echo "Building PCE library: $TARGET"
          if make -C aurora -j2 "$TARGET" > core-build.log 2>&1; then
            echo 'Original Aurora PCE core build completed.'
          else
            echo 'Failed to build the isolated Aurora PCE core.'
            tail -n 150 core-build.log
            exit 1
          fi
          RAW="$BASE/build/beetle-pce-fast-src/mednafen_pce_fast_libretro_ps2_raw.a"
          test -s "$RAW" || { echo 'Raw PCE archive was not produced'; exit 1; }
          mips64r5900el-ps2-elf-nm -g --defined-only "$RAW" > pce-symbols.txt
          grep -Eq '[[:space:]]retro_run$' pce-symbols.txt || {
            echo 'Raw archive does not export the expected Libretro API.'
            exit 1
          }
          echo 'Verified: native Beetle PCE Fast retro_run function.'

      - name: Extract the tested V10/V11 exFAT driver pair
        shell: sh
        run: |
          set -eu
          mkdir -p pce-only
          # Reuse the exact pair previously tested in the PS2 exFAT V10/V11 project.
          # The repository must contain this archive at its root.
          test -s FCEUmm-PS2-exFAT-integrated-2026.zip || {
            echo 'Missing FCEUmm-PS2-exFAT-integrated-2026.zip in repository root.'
            echo 'Add the same driver archive used by the working V10/V11 workflow.'
            exit 1
          }
          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbd.irx \
            > pce-only/usbd.irx
          unzip -p FCEUmm-PS2-exFAT-integrated-2026.zip \
            FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbhdfsd.irx \
            > pce-only/usbhdfsd.irx
          test -s pce-only/usbd.irx
          test -s pce-only/usbhdfsd.irx
          test -s "$PS2SDK/iop/irx/iomanX.irx"
          test -s "$PS2SDK/iop/irx/fileXio.irx"
          echo 'Extracted tested V10/V11 exFAT pair: usbd.irx + usbhdfsd.irx.'

      - name: Generate PS2-only Libretro frontend
        shell: sh
        run: |
          set -eu
          mkdir -p pce-only
          cat > pce-only/pce_only.c <<'PCE_FRONTEND_C'
          /*
           * PCE Fast PS2 - experimental single-core Libretro frontend.
           * Based on the Beetle PCE Fast libretro core used by SNESticle Aurora.
           * This frontend is new; the core is built from its original source.
           * No ROM or firmware bundled. Uses the previously tested V10/V11 exFAT driver pair.
           * Native PS2 libvorbisfile optional; fallback supports cartridges only.
           */
          /* POSIX types are supplied through the explicit PS2 toolchain newlib header in EE_CFLAGS. */
          #include <gsKit.h>
          #include <dmaKit.h>
          #include <libpad.h>
          #include <sifrpc.h>
          #include <loadfile.h>
          #include <sbv_patches.h>
          #include <iopheap.h>
          #include <fileXio_rpc.h>
          #include <io_common.h>
          #include <iox_stat.h>
          #include <libretro.h>
          #include <audsrv.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <ctype.h>
          #include <stdint.h>
          /* Some PS2SDK/newlib headers do not expose snprintf under the current
             feature macros. Declare its standard signature explicitly. */
          extern int snprintf(char *str, size_t size, const char *format, ...);

          #define MAX_FILES 128
          #define MAX_PATH 512
          #define ROM_LIMIT (8u * 1024u * 1024u)
          #define TEX_SIZE 512
          /* PCE emits at most about 882 stereo frames per video frame at 44.1 kHz/50 Hz. */
          #define AUDIO_PENDING_FRAMES 2048

          extern unsigned char usbd_irx[], usbhdfsd_irx[], iomanx_irx[], filexio_irx[], audsrv_irx[];
          extern unsigned int size_usbd_irx, size_usbhdfsd_irx, size_iomanx_irx, size_filexio_irx, size_audsrv_irx;

          typedef struct { char name[256]; int dir; } Entry;
          static Entry entries[MAX_FILES];
          static int nentries, selected, screen, status_code;
          static char folder[MAX_PATH] = "mass:/";
          static char game_path[MAX_PATH];
          static unsigned char *game_data;
          static size_t game_size;
          static char pad_buf[256] __attribute__((aligned(64)));
          static struct padButtonStatus pad_info;
          static unsigned int buttons_now, buttons_prev, buttons_edge;
          static iox_dirent_t dirent_buf __attribute__((aligned(64)));
          static iox_stat_t stat_buf __attribute__((aligned(64)));
          static unsigned char readbuf[16384] __attribute__((aligned(64)));
          static uint32_t pixels[TEX_SIZE * TEX_SIZE] __attribute__((aligned(64)));
          static GSTEXTURE tex;
          static GSGLOBAL *gs;
          static int video_received, pixel_format = RETRO_PIXEL_FORMAT_0RGB1555;
          static int frame_format_used = RETRO_PIXEL_FORMAT_0RGB1555;
          static size_t frame_pitch_used;
          static int video_frame_updated;
          static unsigned frame_w = 256, frame_h = 224;
          static int16_t audio_pending[AUDIO_PENDING_FRAMES * 2] __attribute__((aligned(64)));
          static size_t audio_pending_frames;
          static int core_initialized, core_loaded;
          static int usb_initialized, iop_prepared;
          static int pad_ready;
          /* Port-open status is not proof of live input. */
          static int pad_read_ok, pad_state_value = -1, pad_read_len;
          static unsigned int pad_raw_buttons = 0xffffu;
          static int pad_init_result, pad_open_result;
          static unsigned int input_active_mask, input_query_mask;
          static unsigned int input_mask_query_count;
          static unsigned int input_poll_count, input_state_count;
          static int input_last_port = -1, input_last_device = -1;
          static int input_last_id = -1, input_last_value;
          static int audio_module_loaded, audio_rpc_ready, audio_ready, audio_error;
          static unsigned audio_rate = 44100;
          static unsigned char lut5[32], lut6[64];

          static const char chars[] = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/:._()";
          static const unsigned long long glyphs[] = {
            0x4631fc62eULL,0x3e317c62fULL,0x78210843eULL,0x3e318c62fULL,0x7c217843fULL,
            0x04217843fULL,0x3a31e843eULL,0x4631fc631ULL,0x7c842109fULL,0x19294211cULL,
            0x452519531ULL,0x7c2108421ULL,0x4631ad771ULL,0x4631cd671ULL,0x3a318c62eULL,
            0x04217c62fULL,0x59358c62eULL,0x45257c62fULL,0x3e107043eULL,0x10842109fULL,
            0x3a318c631ULL,0x11518c631ULL,0x4775ac631ULL,0x462a22a31ULL,0x108422a31ULL,
            0x7c222221fULL,0x3a33ae62eULL,0x3884210c4ULL,0x7c444422eULL,0x3e107420fULL,
            0x211f4a988ULL,0x3e107843fULL,0x3a317842eULL,0x08422221fULL,0x3a317462eULL,
            0x3a10f462eULL,0x0000f8000ULL,0x042222210ULL,0x008401080ULL,0x18c000000ULL,
            0x000000000ULL,0x000000000ULL,0x000000000ULL,0x000000000ULL
          };
          static void label(int x,int y,int scale,const char *s,uint64_t color) {
            int i,r,c,j;
            for(i=0;s[i];i++) {
              char ch=(char)toupper((unsigned char)s[i]);
              unsigned long long bits=0;
              for(j=0;chars[j];j++) if(chars[j]==ch) {bits=glyphs[j];break;}
              for(r=0;r<7;r++) for(c=0;c<5;c++) if(bits&(1ULL << (r*5+c))) {
                float xx=(float)(x+(i*6+c)*scale), yy=(float)(y+r*scale);
                gsKit_prim_sprite(gs,xx,yy,xx+scale,yy+scale,1,color);
              }
            }
          }
          static void title_screen(const char *subtitle) {
            uint64_t bg=GS_SETREG_RGBAQ(12,20,35,0x80,0);
            uint64_t white=GS_SETREG_RGBAQ(230,240,245,0x80,0);
            uint64_t aqua=GS_SETREG_RGBAQ(50,210,175,0x80,0);
            gsKit_clear(gs,bg);
            label(45,48,3,"PCE FAST PS2",white);
            label(45,99,2,subtitle,aqua);
          }
          static void refresh_screen(void) { gsKit_queue_exec(gs); gsKit_sync_flip(gs); }
          static void pad_scan(void) {
            int s, n;
            buttons_prev=buttons_now;
            pad_read_ok=0;
            pad_read_len=0;
            if(!pad_ready) {
              pad_state_value=-1; pad_raw_buttons=0xffffu;
              buttons_now=0; buttons_edge=0; return;
            }
            s=padGetState(0,0);
            pad_state_value=s;
            if(s!=PAD_STATE_STABLE && s!=PAD_STATE_FINDCTP1) {
              pad_raw_buttons=0xffffu;
              buttons_now=0; buttons_edge=0; return;
            }
            n=(int)padRead(0,0,&pad_info);
            pad_read_len=n;
            if(n<=0) {
              pad_raw_buttons=0xffffu;
              buttons_now=0; buttons_edge=0; return;
            }
            pad_read_ok=1;
            pad_raw_buttons=(unsigned int)pad_info.btns & 0xffffu;
            buttons_now=(~pad_raw_buttons) & 0xffffu;
            buttons_edge=buttons_now & ~buttons_prev;
          }
          static int load_mod(void *address,unsigned int len) {
            int result=0, id=SifExecModuleBuffer(address,len,0,NULL,&result);
            return (id<0)?id:((result<0)?result:0);
          }
          static void usb_progress(const char *stage) {
            title_screen("V12 EXFAT AUDIO");
            label(52,210,2,stage,GS_SETREG_RGBAQ(50,210,175,0x80,0));
            refresh_screen();
          }
          static int usb_init(void) {
            int r;
            if(usb_initialized)return 0;
            usb_progress("INIT SIF / IOP");
            SifLoadFileInit(); SifInitIopHeap(); sbv_patch_enable_lmb(); iop_prepared=1;
            usb_progress("LOAD IOMANX");
            r=load_mod(iomanx_irx,size_iomanx_irx); if(r<0)return r;
            usb_progress("LOAD FILEXIO");
            r=load_mod(filexio_irx,size_filexio_irx); if(r<0)return r;
            usb_progress("INIT FILEXIO");
            r=fileXioInit(); if(r<0)return r;
            usb_progress("LOAD EXFAT USBD");
            r=load_mod(usbd_irx,size_usbd_irx); if(r<0)return r;
            usb_progress("LOAD EXFAT HDFSD");
            r=load_mod(usbhdfsd_irx,size_usbhdfsd_irx); if(r<0)return r;
            usb_initialized=1;
            usb_progress("EXFAT DRIVERS READY");
            return 0;
          }
          static int audio_init(unsigned requested_rate) {
            int r;
            struct audsrv_fmt_t fmt;
            if(audio_ready) return 0;
            if(!iop_prepared) {
              SifLoadFileInit(); SifInitIopHeap(); sbv_patch_enable_lmb(); iop_prepared=1;
            }
            if(!audio_module_loaded) {
              /* LIBSD is the PS2 IOP sound driver required by audsrv. */
              (void)SifLoadModule("rom0:LIBSD",0,NULL);
              r=load_mod(audsrv_irx,size_audsrv_irx);
              if(r<0) { audio_error=r; return r; }
              audio_module_loaded=1;
            }
            if(!audio_rpc_ready) {
              r=audsrv_init();
              if(r<0) { audio_error=r; return r; }
              audio_rpc_ready=1;
            }
            fmt.freq=(int)(requested_rate ? requested_rate : 44100);
            fmt.bits=16; fmt.channels=2;
            r=audsrv_set_format(&fmt);
            if(r<0 && fmt.freq!=44100) { fmt.freq=44100; r=audsrv_set_format(&fmt); }
            if(r<0 && fmt.freq!=22050) { fmt.freq=22050; r=audsrv_set_format(&fmt); }
            if(r<0) { audio_error=r; return r; }
            r=audsrv_set_volume(90);
            if(r<0) { audio_error=r; return r; }
            audio_rate=(unsigned)fmt.freq;
            audio_ready=1; audio_error=0;
            return 0;
          }
          static unsigned next_pow2(unsigned v) {
            unsigned n=1;
            while(n<v && n<TEX_SIZE)n<<=1;
            return n;
          }
          static int is_pce(const char *name) {
            const char *dot=strrchr(name,'.');
            return dot && dot[1] && dot[2] && dot[3] && !dot[4] &&
              tolower((unsigned char)dot[1])=='p' &&
              tolower((unsigned char)dot[2])=='c' &&
              tolower((unsigned char)dot[3])=='e';
          }
          static int cmp_entry(const void *pa,const void *pb) {
            const Entry *a=(const Entry *)pa,*b=(const Entry *)pb;
            if(a->dir != b->dir) return b->dir-a->dir;
            {
              int i;
              for(i=0;i<256;i++) {
                int ca=tolower((unsigned char)a->name[i]);
                int cb=tolower((unsigned char)b->name[i]);
                if(ca!=cb)return ca-cb;
                if(!ca)return 0;
              }
              return 0;
            }
          }
          static int scan_dir(void) {
            int d=fileXioDopen(folder),r;
            nentries=0; selected=0;
            if(d<0) return d;
            for(;;) {
              memset(&dirent_buf,0,sizeof(dirent_buf));
              r=fileXioDread(d,&dirent_buf);
              if(r<=0)break;
              dirent_buf.name[sizeof(dirent_buf.name)-1]=0;
              if(!strcmp(dirent_buf.name,".")||!strcmp(dirent_buf.name,".."))continue;
              if(!FIO_S_ISDIR(dirent_buf.stat.mode) && !is_pce(dirent_buf.name))continue;
              if(nentries>=MAX_FILES)continue;
              strncpy(entries[nentries].name,dirent_buf.name,sizeof(entries[0].name)-1);
              entries[nentries].name[sizeof(entries[0].name)-1]=0;
              entries[nentries].dir=FIO_S_ISDIR(dirent_buf.stat.mode)?1:0;
              ++nentries;
            }
            fileXioDclose(d);
            qsort(entries,nentries,sizeof(entries[0]),cmp_entry);
            return r<0?r:0;
          }
          static void enter_parent(void) {
            size_t n=strlen(folder), root=!strncmp(folder,"mass0:/",7)?7:6;
            if(n<=root) {screen=0;return;}
            if(folder[n-1]=='/')--n;
            while(n>root&&folder[n-1]!='/')--n;
            folder[n]=0;
            status_code=scan_dir();
          }
          static void render_browser(void) {
            int first=selected-5,i;
            uint64_t white=GS_SETREG_RGBAQ(230,240,245,0x80,0);
            uint64_t aqua=GS_SETREG_RGBAQ(50,210,175,0x80,0);
            char tmp[40],msg[80];
            title_screen("USB EXFAT BROWSER");
            strncpy(tmp,folder,sizeof(tmp)-1);tmp[sizeof(tmp)-1]=0;
            label(45,145,2,tmp,aqua);
            if(first<0)first=0;
            if(first+9>nentries) first=nentries-9;
            if(first<0)first=0;
            for(i=first;i<nentries && i<first+9;i++) {
              snprintf(msg,sizeof(msg),"%c %.*s",entries[i].dir?'D':'R',26,entries[i].name);
              label(50,184+(i-first)*25,2,msg,i==selected?aqua:white);
            }
            if(nentries==0)label(50,210,2,"NO PCE FILES",white);
            label(44,415,2,"UP DOWN X OPEN O BACK",aqua);
          }
          static void unload_game(void) {
            if(core_loaded) {retro_unload_game();core_loaded=0;}
            if(game_data) {free(game_data);game_data=NULL;}
            game_size=0;
            video_received=0;
            video_frame_updated=0;
            audio_pending_frames=0;
          }
          static int read_full_game(const char *path) {
            int fd,n,seek=0;
            size_t off=0, sz;
            memset(&stat_buf,0,sizeof(stat_buf));
            n=fileXioGetStat(path,&stat_buf);
            if(n<0)return n;
            if(stat_buf.hisize || !stat_buf.size || stat_buf.size>ROM_LIMIT)return -100;
            sz=(size_t)stat_buf.size;
            game_data=(unsigned char *)malloc(sz);
            if(!game_data)return -101;
            fd=fileXioOpen(path,FIO_O_RDONLY);
            if(fd<0){unload_game();return fd;}
            seek=fileXioLseek(fd,0,FIO_SEEK_SET);
            if(seek!=0){fileXioClose(fd);unload_game();return -102;}
            while(off<sz) {
              int want=(int)(sz-off);
              if(want>(int)sizeof(readbuf))want=(int)sizeof(readbuf);
              n=fileXioRead(fd,readbuf,want);
              if(n<=0 || n>want) {fileXioClose(fd);unload_game();return n<0?n:-103;}
              memcpy(game_data+off,readbuf,(size_t)n);
              off+=(size_t)n;
            }
            n=fileXioClose(fd);
            if(n<0){unload_game();return n;}
            game_size=sz;
            return 0;
          }
          static bool core_environment(unsigned command,void *data) {
            switch(command) {
              case RETRO_ENVIRONMENT_SET_PIXEL_FORMAT:
                pixel_format=*(const enum retro_pixel_format *)data;
                return pixel_format==RETRO_PIXEL_FORMAT_RGB565 ||
                       pixel_format==RETRO_PIXEL_FORMAT_XRGB8888 ||
                       pixel_format==RETRO_PIXEL_FORMAT_0RGB1555;
              case RETRO_ENVIRONMENT_GET_SYSTEM_DIRECTORY:
                *(const char **)data="mass:/SYSTEM";return true;
              case RETRO_ENVIRONMENT_GET_SAVE_DIRECTORY:
                *(const char **)data="mass:/SAVES";return true;
              case RETRO_ENVIRONMENT_GET_CAN_DUPE:
                *(bool *)data=true;return true;
              case RETRO_ENVIRONMENT_GET_VARIABLE_UPDATE:
                *(bool *)data=false;return true;
              case RETRO_ENVIRONMENT_GET_VARIABLE:
                return false; /* Let the core use its defaults. */
              case RETRO_ENVIRONMENT_SET_VARIABLES:
              case RETRO_ENVIRONMENT_SET_INPUT_DESCRIPTORS:
              case RETRO_ENVIRONMENT_SET_CONTROLLER_INFO:
                return true;
          #ifdef RETRO_ENVIRONMENT_GET_AUDIO_VIDEO_ENABLE
              case RETRO_ENVIRONMENT_GET_AUDIO_VIDEO_ENABLE:
                *(int *)data=3;return true; /* Enable both video (1) and audio (2). */
          #endif
              default:return false;
            }
          }
          static void video_cb(const void *data,unsigned width,unsigned height,size_t pitch) {
            unsigned x,y,tw,th;
            enum retro_pixel_format fmt=(enum retro_pixel_format)pixel_format;
            if(!data || width==0 || height==0 || width>TEX_SIZE || height>TEX_SIZE)return;
            /* Pitch is in bytes. Prefer its unambiguous 32-bit/16-bit stride when a core's
               reported format is stale or inconsistent with the actual callback buffer. */
            if(pitch >= (size_t)width * 4u)
              fmt=RETRO_PIXEL_FORMAT_XRGB8888;
            else if(pitch >= (size_t)width * 2u && fmt==RETRO_PIXEL_FORMAT_XRGB8888)
              fmt=RETRO_PIXEL_FORMAT_0RGB1555;
            frame_format_used=(int)fmt;
            frame_pitch_used=pitch;
            frame_w=width;frame_h=height;
            /* Upload only a power-of-two texture sized to this frame. */
            tw=next_pow2(width); th=next_pow2(height);
            tex.Width=tw; tex.Height=th;
            for(y=0;y<height;y++) {
              const uint8_t *row=(const uint8_t *)data+y*pitch;
              for(x=0;x<width;x++) {
                unsigned r,g,b;
                if(fmt==RETRO_PIXEL_FORMAT_XRGB8888) {
                  unsigned p=((const uint32_t *)row)[x];
                  r=(p>>16)&255u; g=(p>>8)&255u; b=p&255u;
                } else if(fmt==RETRO_PIXEL_FORMAT_RGB565) {
                  unsigned p=((const uint16_t *)row)[x];
                  r=lut5[(p>>11)&31u]; g=lut6[(p>>5)&63u]; b=lut5[p&31u];
                } else {
                  /* Libretro native-endian 0RGB1555: R[14:10], G[9:5], B[4:0]. */
                  unsigned p=((const uint16_t *)row)[x];
                  r=lut5[(p>>10)&31u]; g=lut5[(p>>5)&31u]; b=lut5[p&31u];
                }
                /* GS CT32 byte layout: R, G, B, A. Keep the GS's neutral 0x80 modulation. */
                pixels[y*tw+x]=0x80000000u|(b<<16)|(g<<8)|r;
              }
            }
            video_received=1;
            video_frame_updated=1;
          }
          /* Buffer samples during retro_run(). Avoid an RPC/wait for every individual sample. */
          static size_t audio_many(const int16_t *samples,size_t frames) {
            size_t room,copy_frames;
            if(!samples || frames==0 || !audio_ready) return frames;
            room=AUDIO_PENDING_FRAMES-audio_pending_frames;
            copy_frames=frames<room?frames:room;
            if(copy_frames) {
              memcpy(audio_pending+audio_pending_frames*2u,samples,
                     copy_frames*2u*sizeof(int16_t));
              audio_pending_frames+=copy_frames;
            }
            return frames;
          }
          static void audio_one(int16_t left,int16_t right) {
            int16_t pair[2]; pair[0]=left; pair[1]=right;
            (void)audio_many(pair,1);
          }
          static void audio_flush(void) {
            size_t offset=0,frames,bytes;
            int r;
            if(!audio_ready || audio_pending_frames==0) {
              audio_pending_frames=0;
              return;
            }
            /* Small chunks avoid asking audsrv for more free space than its queue can provide. */
            while(offset<audio_pending_frames) {
              frames=audio_pending_frames-offset;
              if(frames>512u) frames=512u;
              bytes=frames*2u*sizeof(int16_t);
              r=audsrv_wait_audio((int)bytes);
              if(r<0) { audio_error=r; break; }
              r=audsrv_play_audio((const char *)(audio_pending+offset*2u),(int)bytes);
              if(r<0) { audio_error=r; break; }
              offset+=frames;
            }
            audio_pending_frames=0;
          }
          /* Translate PS2 pad bits into the bit positions required by Libretro's JOYPAD_MASK query. */
          static uint16_t retro_joypad_mask(void) {
            unsigned int mask=0;
            if(buttons_now&PAD_CROSS)    mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_B);
            if(buttons_now&PAD_CIRCLE)   mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_A);
            if(buttons_now&PAD_SQUARE)   mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_X);
            if(buttons_now&PAD_TRIANGLE) mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_Y);
            if(buttons_now&PAD_SELECT)   mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_SELECT);
            if(buttons_now&PAD_START)    mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_START);
            if(buttons_now&PAD_UP)       mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_UP);
            if(buttons_now&PAD_DOWN)     mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_DOWN);
            if(buttons_now&PAD_LEFT)     mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_LEFT);
            if(buttons_now&PAD_RIGHT)    mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_RIGHT);
            if(buttons_now&PAD_L1)       mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_L);
            if(buttons_now&PAD_R1)       mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_R);
            if(buttons_now&PAD_L2)       mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_L2);
            if(buttons_now&PAD_R2)       mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_R2);
            if(buttons_now&PAD_L3)       mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_L3);
            if(buttons_now&PAD_R3)       mask |= (1u<<RETRO_DEVICE_ID_JOYPAD_R3);
            return (uint16_t)mask;
          }
          /* The mask is reset immediately before retro_run(), not here: some cores may poll more than once per frame. */
          static void input_poll(void) { input_poll_count++; }
          static int16_t input_state(unsigned port,unsigned device,unsigned index,unsigned id) {
            int16_t result=0;
            (void)index;
            input_state_count++;
            input_last_port=(int)port;
            input_last_device=(int)device;
            input_last_id=(int)id;
            input_last_value=0;
            /* Beetle PCE Fast may query the multitap's fifth port; this frontend exposes the one physical pad on ports 0-4. */
            if(port>4 || (device & RETRO_DEVICE_MASK)!=RETRO_DEVICE_JOYPAD)
              return 0;
            if(id==RETRO_DEVICE_ID_JOYPAD_MASK) {
              input_mask_query_count++;
              result=(int16_t)retro_joypad_mask();
              input_last_value=(int)(uint16_t)result;
              input_active_mask |= (unsigned int)(uint16_t)result;
              return result;
            }
            if(id<16) input_query_mask |= (1u<<id);
            switch(id) {
              case RETRO_DEVICE_ID_JOYPAD_UP: result=!!(buttons_now&PAD_UP); break;
              case RETRO_DEVICE_ID_JOYPAD_DOWN: result=!!(buttons_now&PAD_DOWN); break;
              case RETRO_DEVICE_ID_JOYPAD_LEFT: result=!!(buttons_now&PAD_LEFT); break;
              case RETRO_DEVICE_ID_JOYPAD_RIGHT: result=!!(buttons_now&PAD_RIGHT); break;
              case RETRO_DEVICE_ID_JOYPAD_B: result=!!(buttons_now&PAD_CROSS); break;
              case RETRO_DEVICE_ID_JOYPAD_A: result=!!(buttons_now&PAD_CIRCLE); break;
              case RETRO_DEVICE_ID_JOYPAD_START: result=!!(buttons_now&PAD_START); break;
              case RETRO_DEVICE_ID_JOYPAD_SELECT: result=!!(buttons_now&PAD_SELECT); break;
              case RETRO_DEVICE_ID_JOYPAD_X: result=!!(buttons_now&PAD_SQUARE); break;
              case RETRO_DEVICE_ID_JOYPAD_Y: result=!!(buttons_now&PAD_TRIANGLE); break;
              case RETRO_DEVICE_ID_JOYPAD_L: result=!!(buttons_now&PAD_L1); break;
              case RETRO_DEVICE_ID_JOYPAD_R: result=!!(buttons_now&PAD_R1); break;
              case RETRO_DEVICE_ID_JOYPAD_L2: result=!!(buttons_now&PAD_L2); break;
              case RETRO_DEVICE_ID_JOYPAD_R2: result=!!(buttons_now&PAD_R2); break;
              case RETRO_DEVICE_ID_JOYPAD_L3: result=!!(buttons_now&PAD_L3); break;
              case RETRO_DEVICE_ID_JOYPAD_R3: result=!!(buttons_now&PAD_R3); break;
              default: result=0; break;
            }
            input_last_value=result;
            if(result && id<16) input_active_mask |= (1u<<id);
            return result;
          }
          static int begin_game(const char *path) {
            struct retro_game_info game;
            struct retro_system_info info;
            int r;
            unload_game();
            r=read_full_game(path);
            if(r<0)return r;
            if(!core_initialized) {
              retro_set_environment(core_environment);
              retro_set_video_refresh(video_cb);
              retro_set_audio_sample(audio_one);
              retro_set_audio_sample_batch(audio_many);
              retro_set_input_poll(input_poll);
              retro_set_input_state(input_state);
              retro_init();core_initialized=1;
            }
            /* Expose the connected physical pad to the PCE core's five possible multitap ports. */
            { unsigned int port; for(port=0;port<5;port++) retro_set_controller_port_device(port,RETRO_DEVICE_JOYPAD); }
            retro_get_system_info(&info);
            {
              struct retro_system_av_info av;
              retro_get_system_av_info(&av);
              if(av.timing.sample_rate>0.0)
                (void)audio_init((unsigned)(av.timing.sample_rate+0.5));
              else
                (void)audio_init(44100);
            }
            memset(&game,0,sizeof(game));
            game.path=path;game.data=game_data;game.size=game_size;
            if(!retro_load_game(&game)) {unload_game();return -104;}
            core_loaded=1;
            return 0;
          }
