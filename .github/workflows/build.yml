
name: Build FCEUmm PS2 exFAT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS2 ELF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          apk add --no-cache make git unzip python3 build-base

      - name: Extract source package
        run: |
          test -f FCEUmm-PS2-exFAT-source.zip
          unzip -q FCEUmm-PS2-exFAT-source.zip
          test -f FCEUmm-PS2-exFAT/Makefile.ps2
          test -s FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbd.irx
          test -s FCEUmm-PS2-exFAT/src/drivers/ps2/irx/exfat/usbhdfsd.irx
          echo "Source files extracted successfully"

      - name: Verify PS2 toolchain
        run: |
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"
          test -d "$PS2SDK"
          test -d "$GSKIT"
          command -v mips64r5900el-ps2-elf-gcc
          command -v bin2c

      - name: Enable PS2SDK legacy compatibility
        working-directory: FCEUmm-PS2-exFAT
        run: |
          sed -i '/^PLATFORM_DEFINES = /s/$/ -DNEWLIB_PORT_AWARE/' Makefile.ps2
          grep -q 'DNEWLIB_PORT_AWARE' Makefile.ps2
          echo "Legacy PS2SDK compatibility enabled"

      - name: Build PS2 ELF
        working-directory: FCEUmm-PS2-exFAT
        shell: sh
        run: |
          set -eu
          make -f Makefile.ps2 NOT_PACKED=1 -j1 > build.log 2>&1 || {
            cat build.log
            exit 1
          }
          tail -n 40 build.log

      - name: Verify ELF output
        run: |
          test -s FCEUmm-PS2-exFAT/fceu.elf
          ls -lh FCEUmm-PS2-exFAT/fceu.elf

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-PS2-build-log
          path: FCEUmm-PS2-exFAT/build.log
          if-no-files-found: warn

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: FCEUmm-PS2-exFAT-ELF
          path: FCEUmm-PS2-exFAT/fceu.elf
          if-no-files-found: error
