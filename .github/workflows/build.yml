name: Build PS2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download FCEUmm
        run: |
          apt-get update && apt-get install -y git
          git clone --depth 1 https://github.com/libretro/fceumm.git fceumm

      - name: Build PS2
        run: |
          cd fceumm
          make -f Makefile.libretro platform=ps2

      - name: Find ELF
        run: |
          find . -name "*.elf" -o -name "*.ELF"
          ls -lh fceumm/*.elf || ls -lh *.elf

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: fceumm-ps2
          path: |
            fceumm/*.elf
            *.elf
