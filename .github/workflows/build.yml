
name: Build Original FCEUmm PS2 0.3.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile unmodified official PS2 source
    runs-on: ubuntu-latest
    timeout-minutes: 35

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          set -eu
          apk add --no-cache git make build-base

      - name: Download official FCEUmm PS2 v0.3.3 source
        run: |
          set -eu
          git clone --depth 1 --branch v0.3.3 \
            https://github.com/ps2homebrew/Fceumm-PS2.git \
            original-fceumm

          test -f original-fceumm/Makefile.ps2
          test -f original-fceumm/src/drivers/ps2/init.c

          echo "Official v0.3.3 source downloaded successfully."
          git -C original-fceumm describe --tags --always

      - name: Verify PS2 toolchain
        run: |
          set -eu
          test -d "$PS2SDK"
          test -d "$GSKIT"

          command -v mips64r5900el-ps2-elf-gcc
          command -v bin2c
          command -v make

          echo "Original source will not be patched."

      - name: Compile original ELF without source changes
        working-directory: original-fceumm
        shell: sh
        run: |
          if make -f Makefile.ps2 fceu.elf > build.log 2>&1; then
            echo "Original source compilation succeeded."
            ls -lh fceu.elf
          else
            echo "Original source is not compatible with the current toolchain as-is."

            grep -n -m 40 -E 'fatal error:|error:|undefined reference|multiple definition|cannot find|No such file|Error [0-9]+' build.log || true

            tail -n 120 build.log
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-v033-build-log
          path: original-fceumm/build.log
          if-no-files-found: warn

      - name: Upload original compiled ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: original-v033-fceu-elf
          path: original-fceumm/fceu.elf
          if-no-files-found: error
