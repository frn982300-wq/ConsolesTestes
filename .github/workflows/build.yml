      - name: Locate PS2SDK audsrv audio library and IOP module
        shell: sh
        run: |
          set -eu
          ROOT="${PS2DEV:-/usr/local/ps2dev}"
          HEADER="$(find "$ROOT" -name audsrv.h -type f -print -quit)"
          LIB="$(find "$ROOT" -name libaudsrv.a -type f -print -quit)"
          IRX="$(find "$ROOT" -name audsrv.irx -type f -print -quit)"
          test -s "$HEADER"
          test -s "$LIB"
          test -s "$IRX"
          cp "$IRX" pce-only/audsrv.irx
          dirname
