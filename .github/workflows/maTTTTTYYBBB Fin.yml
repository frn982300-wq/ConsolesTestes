            frontend-build.log \
            zlib-build.log \
            pce-zlib-path.txt \
            pce-zlib-include.txt \
            pce-symbols.txt \
            pce-vorbis-mode.txt \
            pce-vorbis-libs.txt \
            pce-vorbis-extra-objects.txt \
            pce-audsrv-include.txt \
            pce-audsrv-lib.txt \
            aurora/LICENSE \
            aurora/LICENSES/Beetle-PCE-Fast-GPL-2.0.txt; do
            if [ -f "$f" ]; then
              mkdir -p "artifact-staging/$(dirname "$f")"
              cp "$f" "artifact-staging/$f"
