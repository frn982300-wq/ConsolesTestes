name: Extrair pacote FCEUmm para a raiz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair estrutura do pacote
        shell: bash
        run: |
          ZIP="ConsolesTestes-FCEUmm-Interface-Edition-ESTRUTURA-COMPLETA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Não encontrei o ZIP $ZIP na raiz do repositório."
            echo "Envie o ZIP para a raiz do repositório antes de executar."
            exit 1
          fi

          mkdir -p /tmp/fceumm-package
          unzip -q "$ZIP" -d /tmp/fceumm-package

          if [ ! -d /tmp/fceumm-package/ConsolesTestes ]; then
            echo "::error::O ZIP não contém a pasta ConsolesTestes esperada."
            exit 1
          fi

          cp -a /tmp/fceumm-package/ConsolesTestes/. .

          echo "Estrutura extraída:"
          find . -maxdepth 3 -type f | sort

      - name: Salvar arquivos no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para salvar."
          else
            git commit -m "Extrai estrutura completa do FCEUmm Interface Edition"
            git push
          fi
