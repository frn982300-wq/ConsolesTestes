name: Build OPL exFAT USB Prototype

on:
  workflow_dispatch:
  push:
    paths:
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'ee_core/**'
      - 'modules/**'
      - '.github/workflows/build-exfat-usb.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile OPL in the PS2DEV toolchain
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Install build utilities
        run: apk add --no-cache build-base git zip gawk bash

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release
        run: make --trace clean release

      - name: List build outputs
        run: |
          echo 'Build outputs:'
          ls -lh OPNPS2LD-*.ELF OPNPS2LD-*.ZIP opl.elf opl_stripped.elf 2>/dev/null || true
          test -n "$(find . -maxdepth 1 -type f \( -name 'OPNPS2LD-*.ELF' -o -name 'OPNPS2LD-*.ZIP' \) -print -quit)"

      - name: Upload compiled OPL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPL-exFAT-USB-prototype-${{ github.run_number }}
          path: |
            OPNPS2LD-*.ELF
            OPNPS2LD-*.ZIP
            opl.elf
            opl_stripped.elf
          if-no-files-found: error
          retention-days: 14
