          s = s.replace(insert_anchor, background_helpers + '\n' + insert_anchor, 1)

          # Allocate the padded power-of-two GS texture once during startup.
          anchor = '            cover_tex_ready=(cover_tex.Vram!=0);'
          replacement = '''            cover_tex_ready=(cover_tex.Vram!=0);
                      memset(&background_tex,0,sizeof(background_tex));
                      background_tex.Width=BACKGROUND_TEX_W;
                      background_tex.Height=BACKGROUND_TEX_H;
                      background_tex.PSM=GS_PSM_CT16;
                      background_tex.Mem=(u32 *)background_pixels;
                      background_tex.Vram=gsKit_vram_alloc(gs,gsKit_texture_size(BACKGROUND_TEX_W,BACKGROUND_TEX_H,GS_PSM_CT16),GSKIT_ALLOC_USERBUFFER);
                      background_tex_ready=(background_tex.Vram!=0);'''
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one texture init anchor, found {s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)

          # Ensure source is patched only once and includes all expected code.
          checks = [
              'static int decode_background_png_640(',
              'static int read_background_file(',
              'mass:/PCEFAST/background.png',
              'mass0:/PCEFAST/background.png',
              'gsKit_prim_sprite_texture(gs,&background_tex',
              'width!=640u || height!=480u',
              'background_tex_ready=(background_tex.Vram!=0);',
          ]
          for check in checks:
              if check not in s:
                  raise SystemExit(f'Background patch verification failed: {check}')
          if s.count('static void load_background(void)') != 2:
              raise SystemExit('Expected one declaration and one definition of load_background().')
          path.write_text(s)
          print('Background PNG patch applied and verified.')
