          from pathlib import Path

          path = Path('pce-only/pce_only.c')
          s = path.read_text()

          def extract_function(source: str, signature: str):
              start = source.find(signature)
              if start < 0:
                  raise SystemExit(f'Could not find function signature: {signature}')
              brace = source.find('{', start)
              if brace < 0:
                  raise SystemExit(f'Could not find opening brace for: {signature}')
              depth = 0
              in_string = None
              escape = False
              in_line_comment = False
              in_block_comment = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  nxt = source[i+1] if i+1 < len(source) else ''
                  if in_line_comment:
                      if ch == '\n': in_line_comment = False
                      i += 1; continue
                  if in_block_comment:
                      if ch == '*' and nxt == '/': in_block_comment = False; i += 2; continue
                      i += 1; continue
                  if in_string:
                      if escape: escape = False
                      elif ch == '\\': escape = True
                      elif ch == in_string: in_string = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': in_line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': in_block_comment = True; i += 2; continue
                  if ch in ('"', "'"): in_string = ch; i += 1; continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1, source[start:i+1]
                  i += 1
              raise SystemExit(f'Unbalanced function braces: {signature}')

          # Add a cached 640x480 PNG texture and loader state.
          anchor = 'static char cover_debug[96] = "NO COVER CHECK";'
          addition = '''static char cover_debug[96] = "NO COVER CHECK";
          /* Optional user-selected 640x480 PNG background loaded once from USB. */
          #define BACKGROUND_TEX_W 1024
          #define BACKGROUND_TEX_H 512
          #define BACKGROUND_PNG_MAX_BYTES (4u * 1024u * 1024u)
          static uint16_t background_pixels[BACKGROUND_TEX_W * BACKGROUND_TEX_H] __attribute__((aligned(64)));
          static GSTEXTURE background_tex;
          static iox_stat_t background_stat_buf __attribute__((aligned(64)));
          static int background_tex_ready, background_loaded, background_checked, background_error;
          static void load_background(void);
          static void draw_background(void);'''
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one globals anchor, found {s.count(anchor)}')
          s = s.replace(anchor, addition, 1)

          # Draw the optional background before the menu text.
          anchor = '            gsKit_clear(gs,bg);\n            label(45,48,3,"PCE FAST PS2",white);\n            label(45,99,2,subtitle,aqua);'
          replacement = '''            gsKit_clear(gs,bg);
                      draw_background();
                      label(45,48,3,"PCE FAST PS2",white);
                      label(45,99,2,subtitle,aqua);
                      label(548,466,1,background_loaded?"BG PNG OK":"BG DEFAULT",aqua);'''
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one title_screen anchor, found {s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)

          # After USB/exFAT drivers are mounted, look for the chosen image.
          anchor = '            usb_initialized=1;\n            usb_progress("EXFAT DRIVERS READY");'
          replacement = '            usb_initialized=1;\n            load_background();\n            usb_progress("EXFAT DRIVERS READY");'
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one usb_init anchor, found {s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)

          # Clone the existing PNG reader/decoder to support a 640x480 background while
          # leaving the tested 200x200 cover path untouched.
          _, _, read_fn = extract_function(s, 'static int read_cover_file(')
          read_bg = read_fn.replace('read_cover_file', 'read_background_file')
          read_bg = read_bg.replace('cover_stat_buf', 'background_stat_buf')
          read_bg = read_bg.replace('COVER_PNG_MAX_BYTES', 'BACKGROUND_PNG_MAX_BYTES')

          _, _, decode_fn = extract_function(s, 'static int decode_cover_png_200(')
          decode_bg = decode_fn.replace('decode_cover_png_200', 'decode_background_png_640')
          decode_bg = decode_bg.replace('width!=200u || height!=200u', 'width!=640u || height!=480u')
          decode_bg = decode_bg.replace('memset(cover_pixels,0,sizeof(cover_pixels));', 'memset(background_pixels,0,sizeof(background_pixels));')
          decode_bg = decode_bg.replace('cover_pixels[(size_t)y*COVER_TEX_SIZE+x]', 'background_pixels[(size_t)y*BACKGROUND_TEX_W+x]')
          if 'cover_pixels' in decode_bg or 'COVER_TEX_SIZE' in decode_bg or 'width!=200u || height!=200u' in decode_bg:
              raise SystemExit('Background decoder clone still contains cover-specific output dimensions.')

          background_helpers = '''
          /* Read and decode the optional 640x480 background; failure keeps the blue fallback. */
          ''' + read_bg + '\n' + decode_bg + '''
          static int try_background_path(const char *path) {
            unsigned char *data=NULL;
            size_t size=0;
            int r;
            if(!background_tex_ready) { background_error=1; return 0; }
            r=read_background_file(path,&data,&size);
            if(r<0) {
              if(r!=-1) background_error=1;
              return 0;
            }
            r=decode_background_png_640(data,size);
            free(data);
            if(!r) { background_error=1; return 0; }
