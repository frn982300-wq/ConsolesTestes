            background_error=0;
            return 1;
          }
          static void load_background(void) {
            if(background_checked) return;
            background_checked=1;
            background_loaded=0;
            background_error=0;
            if(try_background_path("mass:/PCEFAST/background.png")) return;
            if(try_background_path("mass0:/PCEFAST/background.png")) return;
          }
          static void draw_background(void) {
            if(background_loaded && background_tex_ready) {
