name: Extract FCEUmm package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-package:
    name: Extract project files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and extract the ZIP package
        shell: bash
        run: |
          ZIP_FILE="ConsolesTestes-FCEUmm-Interface-Edition-ESTRUTURA-COMPLETA.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP package not found: $ZIP_FILE"
            echo "Upload the ZIP file to the repository root, then run this workflow again."
            exit 1
          fi

          mkdir -p /tmp/fceumm-package
          unzip -q "$ZIP_FILE" -d /tmp/fceumm-package

          PACKAGE_DIR="/tmp/fceumm-package/ConsolesTestes"
          if [ ! -d "$PACKAGE_DIR" ]; then
            echo "::error::Expected folder 'ConsolesTestes' was not found inside the ZIP package."
            exit 1
          fi

          cp -a "$PACKAGE_DIR/." .

          echo "Project files extracted successfully."
          echo "Top-level project contents:"
          find . -maxdepth 2 -mindepth 1 -print | sort

      - name: Commit extracted project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No file changes need to be committed."
          else
            git commit -m "Extract FCEUmm interface project structure"
            git push
          fi
