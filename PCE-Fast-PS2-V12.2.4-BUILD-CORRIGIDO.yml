    - name: Fix PS2SDK audsrv API and stdio declarations
      shell: sh
      run: |
        set -eu
        python3 - <<'PY_FIX'
        from pathlib import Path
        import re
        p = Path('pce-only/pce_only.c')
        s = p.read_text()
        # stdio must be declared before core_log_printf uses vsnprintf.
        if not re.search(r'^\s*#\s*include\s*<stdio\.h>', s, re.M):
            s = '#include <stdio.h>\n' + s
        # The installed PS2SDK uses audsrv_set_format(freq,bits,channels).
        pattern = r'audsrv_set_format\s*\(\s*&fmt\s*\)'
        n = len(re.findall(pattern, s))
        if n == 0:
            raise SystemExit('Expected audsrv_set_format(&fmt) calls not found; inspect API before building')
        s = re.sub(pattern, 'audsrv_set_format(fmt.freq, fmt.bits, fmt.channels)', s)
        if re.search(r'audsrv_set_format\s*\(\s*&', s):
            raise SystemExit('Unpatched audsrv_set_format pointer call remains')
        p.write_text(s)
        print(f'Fixed {n} audsrv calls and ensured stdio.h is declared')
        PY_FIX
