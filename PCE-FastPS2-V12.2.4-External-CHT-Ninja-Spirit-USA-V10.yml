          from pathlib import Path
          import re
          source=Path('pce-only/pce_only.c').read_text()
          rows=re.findall(r'^\s*\{\"[A-Z0-9]+\", \"',source,re.M)
          if len(rows) < 1500:
              raise SystemExit(f'Universal CHT database unexpectedly small: {len(rows)} rows')
          if 'static void load_game_cheats(void)' not in source:
              raise SystemExit('Per-game CHT loader is missing')
          print(f'Universal CHT database embedded: {len(rows)} entries.')
