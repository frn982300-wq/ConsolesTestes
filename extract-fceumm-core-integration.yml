name: Extract FCEUmm core integration package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-package:
    name: Extract integrated project files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the core integration package
        shell: bash
        run: |
          ZIP_FILE="FCEUmm-Interface-Edition-CORE-INTEGRATION.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP package not found: $ZIP_FILE"
            echo "Upload the ZIP file to the repository root, then run this workflow again."
            exit 1
          fi

          mkdir -p /tmp/fceumm-core-integration
          unzip -q "$ZIP_FILE" -d /tmp/fceumm-core-integration

          PACKAGE_DIR="/tmp/fceumm-core-integration/ConsolesTestes"
          if [ ! -d "$PACKAGE_DIR/src/core" ] || [ ! -f "$PACKAGE_DIR/src/ps2bridge/fceumm_core_bridge.c" ]; then
            echo "::error::The ZIP does not contain the expected FCEUmm core integration source tree."
            exit 1
          fi

          # Keep .github/workflows unchanged. The build workflow is installed separately.
          tar --exclude='./.github' -C "$PACKAGE_DIR" -cf - . | tar -C "$GITHUB_WORKSPACE" -xf -

          rm -f "$ZIP_FILE"

          echo "FCEUmm core integration files extracted."
          echo "The existing .github/workflows directory was left untouched."
          echo "Core source files:"
          find src/core src/ps2bridge -maxdepth 2 -type f | sort | head -n 80

      - name: Commit extracted project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No file changes need to be committed."
          else
            git commit -m "Add FCEUmm PS2 core integration sources"
            git push
          fi
